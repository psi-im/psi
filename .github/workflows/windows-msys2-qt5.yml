name: Windows 7 Qt5 compile/test CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-legacy-msys2-qt5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-sdk:
    name: Check legacy dependency SDK
    runs-on: ubuntu-24.04
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      run_ci: ${{ steps.policy.outputs.run_ci }}
      sdk_tag: ${{ steps.deps.outputs.msys2_sdk_tag }}
      sdk_archive: ${{ steps.deps.outputs.msys2_sdk_archive }}

    steps:
      - name: Resolve ai branch CI policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUSH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          run_ci=true
          message=""

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            message="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq '.commit.message')"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            message="$PUSH_COMMIT_MESSAGE"
          fi

          if [[ "$EVENT_NAME" != "workflow_dispatch" && "$message" == *"[skip ci]"* ]]; then
            run_ci=false
          fi

          echo "run_ci=$run_ci" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.policy.outputs.run_ci == 'true'

      - name: Resolve locked Windows SDK
        id: deps
        if: steps.policy.outputs.run_ci == 'true'
        uses: ./.github/actions/load-dependencies

      - name: Check release asset
        if: steps.policy.outputs.run_ci == 'true'
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ steps.deps.outputs.msys2_sdk_tag }}
          SDK_ARCHIVE: ${{ steps.deps.outputs.msys2_sdk_archive }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$SDK_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' 2>/dev/null || true)"

          if grep -Fxq "$SDK_ARCHIVE" <<< "$assets"; then
            echo "SDK found: $SDK_TAG/$SDK_ARCHIVE"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "SDK missing: $SDK_TAG/$SDK_ARCHIVE"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-sdk:
    name: Build missing legacy dependency SDK
    needs: check-sdk
    if: >-
      needs.check-sdk.outputs.run_ci == 'true' &&
      needs.check-sdk.outputs.exists != 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/windows-sdk-msys2-qt5.yml
    with:
      sdk_tag: ${{ needs.check-sdk.outputs.sdk_tag }}
      force_rebuild: false

  legacy-win7:
    name: Compile and test legacy Windows 7 Qt5
    needs:
      - check-sdk
      - build-sdk
    if: >-
      always() &&
      needs.check-sdk.result == 'success' &&
      needs.check-sdk.outputs.run_ci == 'true' &&
      (needs.check-sdk.outputs.exists == 'true' || needs.build-sdk.result == 'success')
    permissions:
      contents: read
    uses: ./.github/workflows/windows-msys2-qt5-profile.yml
    with:
      profile: legacy-win7
      chat_type: BASIC
      allow_failure: false
      run_tests: true
      package: false
      sdk_tag: ${{ needs.check-sdk.outputs.sdk_tag }}
      sdk_archive: ${{ needs.check-sdk.outputs.sdk_archive }}
