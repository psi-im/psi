name: Windows MSYS2 Qt5 CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-msys2-qt5-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_TAG: windows-sdk-msys2-qt5-v1
  SDK_ARCHIVE: psi-windows-sdk-msys2-qt5.zip

jobs:
  check-sdk:
    name: Check dependency SDK
    runs-on: ubuntu-24.04
    outputs:
      exists: ${{ steps.check.outputs.exists }}

    steps:
      - name: Check release asset
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$SDK_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' 2>/dev/null || true)"

          if grep -Fxq "$SDK_ARCHIVE" <<< "$assets"; then
            echo "SDK found: $SDK_TAG/$SDK_ARCHIVE"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "SDK missing: $SDK_TAG/$SDK_ARCHIVE"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-sdk:
    name: Build missing dependency SDK
    needs: check-sdk
    if: needs.check-sdk.outputs.exists != 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/windows-sdk-msys2-qt5.yml
    with:
      sdk_tag: windows-sdk-msys2-qt5-v1
      force_rebuild: false

  modern:
    name: Build modern Windows 10/11 x64 package
    needs:
      - check-sdk
      - build-sdk
    if: >-
      always() &&
      needs.check-sdk.result == 'success' &&
      (needs.check-sdk.outputs.exists == 'true' || needs.build-sdk.result == 'success')
    permissions:
      contents: read
    uses: ./.github/workflows/windows-msys2-qt5-profile.yml
    with:
      profile: modern
      allow_failure: false
      sdk_tag: windows-sdk-msys2-qt5-v1
      sdk_archive: psi-windows-sdk-msys2-qt5.zip

  legacy-win7:
    name: Build legacy Windows 7 x64 package
    needs:
      - check-sdk
      - build-sdk
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.check-sdk.result == 'success' &&
      (needs.check-sdk.outputs.exists == 'true' || needs.build-sdk.result == 'success')
    permissions:
      contents: read
    uses: ./.github/workflows/windows-msys2-qt5-profile.yml
    with:
      profile: legacy-win7
      allow_failure: true
      sdk_tag: windows-sdk-msys2-qt5-v1
      sdk_archive: psi-windows-sdk-msys2-qt5.zip
