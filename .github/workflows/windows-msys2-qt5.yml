name: Windows legacy MSYS2 Qt5 CI

on:
  push:
    branches:
      - master
      - 'ai/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-legacy-msys2-qt5-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_TAG: windows-sdk-msys2-qt5-v1
  SDK_ARCHIVE: psi-windows-sdk-msys2-qt5.zip

jobs:
  check-sdk:
    if: >-
      github.event_name != 'push' || !startsWith(github.ref_name, 'ai/') || !contains(github.event.head_commit.message, '[skip ci]')
    name: Check legacy dependency SDK
    runs-on: ubuntu-24.04
    outputs:
      exists: ${{ steps.check.outputs.exists }}

    steps:
      - name: Check release asset
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$SDK_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' 2>/dev/null || true)"

          if grep -Fxq "$SDK_ARCHIVE" <<< "$assets"; then
            echo "SDK found: $SDK_TAG/$SDK_ARCHIVE"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "SDK missing: $SDK_TAG/$SDK_ARCHIVE"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-sdk:
    name: Build missing legacy dependency SDK
    needs: check-sdk
    if: >-
      (github.event_name != 'push' || !startsWith(github.ref_name, 'ai/') || !contains(github.event.head_commit.message, '[skip ci]')) &&
      needs.check-sdk.outputs.exists != 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/windows-sdk-msys2-qt5.yml
    with:
      sdk_tag: windows-sdk-msys2-qt5-v1
      force_rebuild: false

  legacy-win7:
    name: Build legacy Windows 7 x64 package
    needs:
      - check-sdk
      - build-sdk
    if: >-
      (github.event_name != 'push' || !startsWith(github.ref_name, 'ai/') || !contains(github.event.head_commit.message, '[skip ci]')) &&
      always() &&
      needs.check-sdk.result == 'success' &&
      (needs.check-sdk.outputs.exists == 'true' || needs.build-sdk.result == 'success')
    permissions:
      contents: read
    uses: ./.github/workflows/windows-msys2-qt5-profile.yml
    with:
      profile: legacy-win7
      allow_failure: true
      sdk_tag: windows-sdk-msys2-qt5-v1
      sdk_archive: psi-windows-sdk-msys2-qt5.zip
