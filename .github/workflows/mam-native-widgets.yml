name: MAM native widget regressions

on:
  push:
    paths:
      - 'src/widgets/LongListWidget.*'
      - 'src/widgets/OverlayScrollBarManager.*'
      - 'src/widgets/ThinSplitter.*'
      - 'src/widgets/MamChatWidget.*'
      - 'src/widgets/ChatMessageText.*'
      - 'src/widgets/MessagePreview.*'
      - 'src/widgets/LinkButton.*'
      - 'src/chatreply.*'
      - 'src/desktopcolorpalette.h'
      - 'src/widgets/psirichtext.*'
      - 'src/widgets/psitextview.*'
      - 'src/oobmediapolicy.h'
      - 'tests/filesharing/oobmedia.cpp'
      - '3rdparty/qite'
      - 'src/widgets/NativeChatThemeRegistry.*'
      - 'src/widgets/NativeChatRenderers.*'
      - 'plugins/include/nativechatthemeprovider.h'
      - 'plugins/include/nativechatrenderer.h'
      - 'tests/mamchat/**'
      - 'tests/mamhistory/**'
      - 'src/historyarchive.*'
      - 'src/widgets/MamHistorySourcePolicy.h'
      - '.github/workflows/mam-native-widgets.yml'
  pull_request:
    paths:
      - 'src/widgets/LongListWidget.*'
      - 'src/widgets/OverlayScrollBarManager.*'
      - 'src/widgets/ThinSplitter.*'
      - 'src/widgets/MamChatWidget.*'
      - 'src/widgets/ChatMessageText.*'
      - 'src/widgets/MessagePreview.*'
      - 'src/widgets/LinkButton.*'
      - 'src/chatreply.*'
      - 'src/desktopcolorpalette.h'
      - 'src/widgets/psirichtext.*'
      - 'src/widgets/psitextview.*'
      - 'src/oobmediapolicy.h'
      - 'tests/filesharing/oobmedia.cpp'
      - '3rdparty/qite'
      - 'src/widgets/NativeChatThemeRegistry.*'
      - 'src/widgets/NativeChatRenderers.*'
      - 'plugins/include/nativechatthemeprovider.h'
      - 'plugins/include/nativechatrenderer.h'
      - 'tests/mamchat/**'
      - 'tests/mamhistory/**'
      - 'src/historyarchive.*'
      - 'src/widgets/MamHistorySourcePolicy.h'
      - '.github/workflows/mam-native-widgets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only the newest commit of a PR needs expensive build/test runners.
  # Keep manual dispatches independent and keep master distinct from PRs.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  widget-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve qite
        run: git submodule update --init --depth 1 3rdparty/qite
      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache cmake ninja-build qt6-base-dev qt6-multimedia-dev libqt6sql6-sqlite
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: psi-mam-widgets-qt6-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            psi-mam-widgets-qt6-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-
            psi-mam-widgets-qt6-${{ runner.os }}-
      - name: Configure compiler cache
        run: |
          ccache --max-size=400M
          ccache --zero-stats
      - name: Configure
        run: |
          cmake -S tests/mamchat -B build-mam-widgets -G Ninja \
            -DQT_DEFAULT_MAJOR_VERSION=6 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build-mam-widgets --parallel 4
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-mam-widgets --output-on-failure

      - name: Configure SQLite history regressions
        run: |
          cmake -S tests/mamhistory -B build-mam-history -G Ninja \
            -DQT_DEFAULT_MAJOR_VERSION=6 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build SQLite history regressions
        run: cmake --build build-mam-history --parallel 4
      - name: Test SQLite history regressions
        run: ctest --test-dir build-mam-history --output-on-failure
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

