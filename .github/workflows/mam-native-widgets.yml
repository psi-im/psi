name: MAM native widget regressions

on:
  push:
    paths:
      - 'src/widgets/LongListWidget.*'
      - 'src/widgets/OverlayScrollBarManager.*'
      - 'src/widgets/MamChatWidget.*'
      - 'tests/mamchat/**'
      - '.github/workflows/mam-native-widgets.yml'
  pull_request:
    paths:
      - 'src/widgets/LongListWidget.*'
      - 'src/widgets/OverlayScrollBarManager.*'
      - 'src/widgets/MamChatWidget.*'
      - 'tests/mamchat/**'
      - '.github/workflows/mam-native-widgets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  widget-regressions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        qt: [5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: |
          sudo apt-get update
          if [ "${{ matrix.qt }}" = "6" ]; then
            sudo apt-get install -y cmake ninja-build qt6-base-dev
          else
            sudo apt-get install -y cmake ninja-build qtbase5-dev
          fi
      - name: Configure
        run: cmake -S tests/mamchat -B build-mam-widgets -G Ninja -DQT_DEFAULT_MAJOR_VERSION=${{ matrix.qt }}
      - name: Build
        run: cmake --build build-mam-widgets --parallel 4
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-mam-widgets --output-on-failure

