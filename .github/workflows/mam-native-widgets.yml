name: MAM native widget regressions

on:
  push:
    paths:
      - 'src/widgets/LongListWidget.*'
      - 'src/widgets/OverlayScrollBarManager.*'
      - 'src/widgets/MamChatWidget.*'
      - 'src/widgets/ChatMessageText.*'
      - 'src/desktopcolorpalette.h'
      - 'src/widgets/psirichtext.*'
      - 'src/widgets/psitextview.*'
      - '3rdparty/qite'
      - 'src/widgets/NativeChatThemeRegistry.*'
      - 'plugins/include/nativechatthemeprovider.h'
      - 'tests/mamchat/**'
      - 'tests/mamhistory/**'
      - 'src/historyarchive.*'
      - 'src/widgets/MamHistorySourcePolicy.h'
      - '.github/workflows/mam-native-widgets.yml'
  pull_request:
    paths:
      - 'src/widgets/LongListWidget.*'
      - 'src/widgets/OverlayScrollBarManager.*'
      - 'src/widgets/MamChatWidget.*'
      - 'src/widgets/ChatMessageText.*'
      - 'src/desktopcolorpalette.h'
      - 'src/widgets/psirichtext.*'
      - 'src/widgets/psitextview.*'
      - '3rdparty/qite'
      - 'src/widgets/NativeChatThemeRegistry.*'
      - 'plugins/include/nativechatthemeprovider.h'
      - 'tests/mamchat/**'
      - 'tests/mamhistory/**'
      - 'src/historyarchive.*'
      - 'src/widgets/MamHistorySourcePolicy.h'
      - '.github/workflows/mam-native-widgets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  widget-regressions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        qt: [5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Resolve qite
        run: git submodule update --init --depth 1 3rdparty/qite
      - name: Install Qt
        run: |
          sudo apt-get update
          if [ "${{ matrix.qt }}" = "6" ]; then
            sudo apt-get install -y ccache cmake ninja-build qt6-base-dev qt6-multimedia-dev libqt6sql6-sqlite
          else
            sudo apt-get install -y ccache cmake ninja-build qtbase5-dev qtmultimedia5-dev libqt5sql5-sqlite
          fi
      - name: Install callgrind and perf (Qt6 profile only)
        if: matrix.qt == 6
        run: sudo apt-get install -y valgrind linux-tools-common linux-tools-generic
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: psi-mam-widgets-qt${{ matrix.qt }}-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            psi-mam-widgets-qt${{ matrix.qt }}-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-
            psi-mam-widgets-qt${{ matrix.qt }}-${{ runner.os }}-
      - name: Configure compiler cache
        run: |
          ccache --max-size=400M
          ccache --zero-stats
      - name: Configure
        run: |
          cmake -S tests/mamchat -B build-mam-widgets -G Ninja \
            -DQT_DEFAULT_MAJOR_VERSION=${{ matrix.qt }} \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -g -DNDEBUG -fno-omit-frame-pointer" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build-mam-widgets --parallel 4
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-mam-widgets --output-on-failure

      - name: Profile splitter resize with perf and callgrind
        if: matrix.qt == 6
        env:
          QT_QPA_PLATFORM: offscreen
          PSI_MAM_RESIZE_PROFILE: '1'
        run: |
          set -o pipefail
          echo "=== Baseline timings without profiler ==="
          PSI_MAM_RESIZE_SCENARIO=simple ./build-mam-widgets/mam_chat_widget_test resizeProfilingScenario 2>&1 | tee mam-resize-simple.log
          PSI_MAM_RESIZE_SCENARIO=rich ./build-mam-widgets/mam_chat_widget_test resizeProfilingScenario 2>&1 | tee mam-resize-rich.log
          echo "=== Try Linux perf (can be restricted on hosted runners) ==="
          if command -v perf >/dev/null 2>&1; then
            perf record --call-graph fp -g -o mam-resize.perf.data -- \
              ./build-mam-widgets/mam_chat_widget_test resizeProfilingScenario \
              >mam-resize-perf.log 2>&1 && \
              perf report --stdio --no-children --percent-limit 0.5 -i mam-resize.perf.data \
                | head -n 100 | tee mam-resize-perf-summary.txt \
              || { echo "Linux perf unavailable; see mam-resize-perf.log"; cat mam-resize-perf.log; }
          else
            echo "Linux perf binary unavailable; using callgrind"
          fi
          echo "=== Callgrind: collect only splitter resize loop ==="
          valgrind --tool=callgrind --collect-atstart=no --callgrind-out-file=mam-resize.callgrind \
            ./build-mam-widgets/mam_chat_widget_test resizeProfilingScenario \
            2>&1 | tee mam-resize-callgrind.log
          callgrind_annotate --auto=yes --threshold=98 mam-resize.callgrind \
            | head -n 120 | tee mam-resize-top.txt
      - name: Upload MAM resize profile
        if: always() && matrix.qt == 6
        uses: actions/upload-artifact@v4
        with:
          name: mam-resize-profile-qt6
          path: |
            mam-resize-simple.log
            mam-resize-rich.log
            mam-resize-perf.log
            mam-resize-perf-summary.txt
            mam-resize.perf.data
            mam-resize-callgrind.log
            mam-resize.callgrind
            mam-resize-top.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Configure SQLite history regressions
        run: |
          cmake -S tests/mamhistory -B build-mam-history -G Ninja \
            -DQT_DEFAULT_MAJOR_VERSION=${{ matrix.qt }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build SQLite history regressions
        run: cmake --build build-mam-history --parallel 4
      - name: Test SQLite history regressions
        run: ctest --test-dir build-mam-history --output-on-failure
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
