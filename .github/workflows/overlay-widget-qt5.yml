name: Overlay widgets Qt5 regressions

on:
  pull_request:
    paths:
      - 'src/widgets/OverlayScrollBarManager.*'
      - 'src/widgets/ThinSplitter.*'
      - 'tests/mamchat/OverlayScrollBarManagerTest.cpp'
      - 'tests/mamchat/ThinSplitterTest.cpp'
      - 'tests/mamchat/CMakeLists.txt'
      - '.github/workflows/overlay-widget-qt5.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overlay-widgets-qt5-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  overlay-and-splitter:
    name: Overlay scrollbar and splitter (Qt5)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve qite
        run: git submodule update --init --depth 1 3rdparty/qite
      - name: Install Qt5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ qtbase5-dev qtmultimedia5-dev
      - name: Configure focused widget regressions
        run: |
          cmake -S tests/mamchat -B build-mam-widgets-qt5 -G Ninja \
            -DQT_DEFAULT_MAJOR_VERSION=5
      - name: Build focused widget regressions
        run: |
          cmake --build build-mam-widgets-qt5 \
            --target mam_overlay_scrollbar_test mam_thin_splitter_test --parallel 4
      - name: Test overlay and splitter
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build-mam-widgets-qt5 --output-on-failure \
            -R "^(mam_overlay_scrollbar|mam_thin_splitter)$"
