name: PsiMedia integration

on:
  pull_request:
    branches:
      - ai/jingle-native-calls
  workflow_dispatch:

permissions:
  contents: read

env:
  QCA_TAG: v3.0.7

concurrency:
  group: psimedia-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-qt6:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Psi native-call branch
        uses: actions/checkout@v4
        with:
          ref: ai/jingle-native-calls
          submodules: false

      - name: Initialize pinned Iris
        shell: bash
        run: git submodule update --init --depth 1 iris

      - name: Checkout psimedia RTP session branch
        uses: actions/checkout@v4
        with:
          repository: psi-im/psimedia
          ref: jingle/rtcp-session
          path: _psimedia
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ccache \
            g++ \
            ninja-build \
            pkg-config \
            qtbase5-dev \
            libssl-dev \
            libsrtp2-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-tools

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-psimedia-integration-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-psimedia-integration-ccache-

      - name: Install QCA3 release package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf qca-release qca3.zip
          mkdir qca-release
          gh release download "$QCA_TAG" --repo psi-im/qca \
            -p 'qca3-deb-ubuntu-24.04.zip' -O qca3.zip
          (cd qca-release && cmake -E tar xvf ../qca3.zip)
          test -n "$(find qca-release -type f -name '*.deb' -print -quit)"
          sudo apt-get install -y ./qca-release/*.deb

      - name: Record integration versions
        run: |
          echo "Psi: $(git rev-parse HEAD)"
          echo "Iris: $(git -C iris rev-parse HEAD)"
          echo "psimedia: $(git -C _psimedia rev-parse HEAD)"
          echo "QCA: psi-im/qca v3.0.7 release package (qca-ossl)"
          qmake6 -v
          openssl version
          gst-launch-1.0 --version
          pkg-config --modversion gstreamer-1.0 gstreamer-rtp-1.0 libsrtp2

      - name: Configure integration smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _psimedia-smoke
          cat > _psimedia-smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.19)
          project(psimedia_integration_smoke LANGUAGES CXX)

          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_AUTOMOC ON)
          set(QT_DEFAULT_MAJOR_VERSION 6)
          set(BUILD_DEMO OFF CACHE BOOL "" FORCE)
          set(BUILD_PSIPLUGIN ON CACHE BOOL "" FORCE)
          set(PSIMEDIA_BUILD_TESTS ON CACHE BOOL "" FORCE)
          set(USE_PSI ON CACHE BOOL "" FORCE)
          set(MAIN_PROGRAM_NAME psi CACHE STRING "" FORCE)

          if(NOT DEFINED PSI_SOURCE_DIR OR NOT DEFINED PSIMEDIA_SOURCE_DIR)
              message(FATAL_ERROR "PSI_SOURCE_DIR and PSIMEDIA_SOURCE_DIR are required")
          endif()

          find_package(Qt6 REQUIRED COMPONENTS Core Gui Widgets Network Xml)

          enable_testing()
          set(PLUGINS_ROOT_DIR "${PSI_SOURCE_DIR}/plugins" CACHE STRING "" FORCE)

          set(IRIS_ENABLE_INSTALL OFF CACHE BOOL "" FORCE)
          set(IRIS_ENABLE_SRTP ON CACHE BOOL "" FORCE)
          set(IRIS_ENABLE_JINGLE_SCTP OFF CACHE BOOL "" FORCE)
          set(IRIS_ENABLE_OMEMO OFF CACHE BOOL "" FORCE)
          set(IRIS_BUNDLED_USRSCTP OFF CACHE BOOL "" FORCE)
          set(IRIS_BUNDLED_QCA OFF CACHE BOOL "" FORCE)
          set(IRIS_SYSTEM_QCA 3 CACHE STRING "" FORCE)
          set(USE_QT6 ON CACHE BOOL "" FORCE)
          add_subdirectory("${PSI_SOURCE_DIR}/iris" iris)

          add_subdirectory("${PSIMEDIA_SOURCE_DIR}" psimedia)

          add_library(psi_native_media_adapter STATIC
              "${PSI_SOURCE_DIR}/src/psimedia/psimedia.cpp"
              "${PSI_SOURCE_DIR}/src/psimedia/psimedia.h"
              "${PSI_SOURCE_DIR}/src/psimedia/psimedia_p.h"
              "${PSI_SOURCE_DIR}/src/avcall/psimediajingle.cpp"
              "${PSI_SOURCE_DIR}/src/avcall/psimediajingle.h"
          )
          target_compile_definitions(psi_native_media_adapter PRIVATE QT_GUI_LIB)
          target_include_directories(psi_native_media_adapter PUBLIC
              "${PSI_SOURCE_DIR}/src"
              "${PSI_SOURCE_DIR}/src/psimedia"
              "${PSI_SOURCE_DIR}/src/avcall"
              "${PSI_SOURCE_DIR}/plugins/include"
          )
          target_link_libraries(psi_native_media_adapter PUBLIC
              Iris::Iris
              Qt6::Core
              Qt6::Gui
              Qt6::Widgets
          )

          add_executable(psimedia_provider_smoke smoke.cpp)
          target_include_directories(psimedia_provider_smoke PRIVATE
              "${PSI_SOURCE_DIR}/plugins/include"
              "${PSIMEDIA_SOURCE_DIR}/gstprovider"
          )
          target_link_libraries(psimedia_provider_smoke PRIVATE gstprovidersrc Qt6::Core)

          add_test(NAME psimedia_provider_smoke COMMAND psimedia_provider_smoke)
          set_tests_properties(psimedia_provider_smoke PROPERTIES TIMEOUT 30)

          add_executable(psi_native_media_adapter_smoke native_adapter_smoke.cpp)
          target_include_directories(psi_native_media_adapter_smoke PRIVATE
              "${PSI_SOURCE_DIR}/src/psimedia"
              "${PSI_SOURCE_DIR}/src/avcall"
              "${PSI_SOURCE_DIR}/plugins/include"
              "${PSIMEDIA_SOURCE_DIR}/gstprovider"
          )
          target_link_libraries(psi_native_media_adapter_smoke PRIVATE
              psi_native_media_adapter
              gstprovidersrc
              Iris::Iris
              Qt6::Core
          )
          add_test(NAME psi_native_media_adapter_smoke COMMAND psi_native_media_adapter_smoke)
          set_tests_properties(psi_native_media_adapter_smoke PROPERTIES TIMEOUT 30)

          add_executable(psi_native_media_peer_smoke native_media_peer_smoke.cpp)
          target_include_directories(psi_native_media_peer_smoke PRIVATE
              "${PSI_SOURCE_DIR}/src/psimedia"
              "${PSI_SOURCE_DIR}/src/avcall"
              "${PSI_SOURCE_DIR}/plugins/include"
              "${PSIMEDIA_SOURCE_DIR}/gstprovider"
          )
          target_link_libraries(psi_native_media_peer_smoke PRIVATE
              psi_native_media_adapter
              gstprovidersrc
              Iris::Iris
              Qt6::Core
              Qt6::Network
          )
          add_test(NAME psi_native_media_peer_smoke COMMAND psi_native_media_peer_smoke)
          set_tests_properties(psi_native_media_peer_smoke PROPERTIES TIMEOUT 35)
          EOF

          cat > _psimedia-smoke/smoke.cpp <<'EOF'
          #include "gstprovider.h"
          #include "psimediaprovider.h"

          #include <QCoreApplication>
          #include <QDebug>

          static_assert(sizeof(PsiMedia::PRtpPacket::Type) == sizeof(int));
          static_assert(static_cast<int>(PsiMedia::PRtpPacket::Type::Rtp) == 0);
          static_assert(static_cast<int>(PsiMedia::PRtpPacket::Type::Rtcp) == 1);

          int main(int argc, char **argv)
          {
              QCoreApplication app(argc, argv);

              PsiMedia::GstProvider provider;
              if (!provider.isInitialized()) {
                  qCritical() << "GstProvider failed to initialize";
                  return 1;
              }

              auto *session = provider.createRtpSession();
              if (!session) {
                  qCritical() << "GstProvider returned a null RTP session";
                  return 2;
              }
              if (!session->qobject()) {
                  qCritical() << "GstProvider RTP session has no QObject facade";
                  delete session;
                  return 3;
              }

              delete session;
              qInfo() << "Real psimedia provider smoke passed";
              return 0;
          }
          EOF

          cat > _psimedia-smoke/native_adapter_smoke.cpp <<'EOF'
          #include "gstprovider.h"
          #include "psimedia.h"
          #include "psimediajingle.h"

          #include <iris/jingle-rtp.h>

          #include <QCoreApplication>
          #include <QDebug>
          #include <QElapsedTimer>
          #include <QEventLoop>
          #include <QThread>

          #include <algorithm>
          #include <optional>
          #include <utility>
          #include <vector>

          namespace RTP = XMPP::Jingle::RTP;

          template<typename Predicate> bool waitUntil(Predicate predicate, int timeoutMs)
          {
              QElapsedTimer timer;
              timer.start();
              while (timer.elapsed() < timeoutMs) {
                  QCoreApplication::processEvents(QEventLoop::AllEvents, 20);
                  if (predicate())
                      return true;
                  QThread::msleep(5);
              }
              QCoreApplication::processEvents(QEventLoop::AllEvents);
              return predicate();
          }

          QByteArray makeOpusRtp(quint16 sequence, quint32 timestamp, quint32 ssrc, quint8 payloadType)
          {
              QByteArray packet(15, char(0));
              auto *p = reinterpret_cast<uchar *>(packet.data());
              p[0]  = 0x80;
              p[1]  = payloadType & 0x7f;
              p[2]  = uchar(sequence >> 8);
              p[3]  = uchar(sequence);
              p[4]  = uchar(timestamp >> 24);
              p[5]  = uchar(timestamp >> 16);
              p[6]  = uchar(timestamp >> 8);
              p[7]  = uchar(timestamp);
              p[8]  = uchar(ssrc >> 24);
              p[9]  = uchar(ssrc >> 16);
              p[10] = uchar(ssrc >> 8);
              p[11] = uchar(ssrc);
              // Valid Opus comfort/silence frame used only to exercise the
              // receive pipeline without any physical playback device.
              p[12] = 0xf8;
              p[13] = 0xff;
              p[14] = 0xfe;
              return packet;
          }

          bool containsReceiverReport(const QByteArray &compound)
          {
              const auto *bytes = reinterpret_cast<const uchar *>(compound.constData());
              int offset = 0;
              while (offset + 4 <= compound.size()) {
                  const auto *packet = bytes + offset;
                  if ((packet[0] >> 6) != 2)
                      return false;
                  const int packetBytes = (int(packet[2]) * 256 + int(packet[3]) + 1) * 4;
                  if (packetBytes < 4 || offset + packetBytes > compound.size())
                      return false;
                  if (packet[1] == 201)
                      return true;
                  offset += packetBytes;
              }
              return false;
          }

          int main(int argc, char **argv)
          {
              QCoreApplication app(argc, argv);

              PsiMedia::GstProvider gstProvider;
              if (!gstProvider.isInitialized()) {
                  qCritical() << "GstProvider failed to initialize";
                  return 1;
              }
              PsiMedia::setProvider(&gstProvider);

              PsiMediaJingleCapabilities capabilities;
              capabilities.backendAvailable = true;
              capabilities.probeComplete    = true;
              capabilities.secureRtp        = true;
              capabilities.audio            = true;

              auto provider = makePsiMediaJingleProvider(capabilities);
              if (!provider || provider->mediaTypes() != QStringList { QStringLiteral("audio") }) {
                  qCritical() << "Psi native media provider did not expose audio";
                  return 2;
              }

              auto session = provider->createSession();
              auto endpoint = session ? session->createEndpoint(QStringLiteral("audio"), QStringLiteral("audio"))
                                      : nullptr;
              if (!session || !endpoint) {
                  qCritical() << "Psi native media adapter did not create audio session/endpoint";
                  return 3;
              }

              bool runtimeFailed = false;
              RTP::MediaError runtimeError;
              QObject::connect(session.get(), &RTP::MediaSession::runtimeError,
                               [&](const RTP::MediaError &error) {
                                   runtimeFailed = true;
                                   runtimeError  = error;
                               });

              bool prepared = false;
              RTP::MediaError prepareError;
              std::optional<RTP::Description> local;
              auto prepare = session->prepareLocalOffer(
                  endpoint.get(),
                  [&](RTP::MediaOperation::Id, std::optional<RTP::Description> description, RTP::MediaError error) {
                      local        = std::move(description);
                      prepareError = std::move(error);
                      prepared     = true;
                  });
              if (!prepare || !waitUntil([&] { return prepared || runtimeFailed; }, 10000) || runtimeFailed
                  || prepareError || !local || local->media != QLatin1String("audio") || !local->rtcpMux
                  || local->payloads.isEmpty()) {
                  qCritical() << "Device-free real-backend RTP prepare failed"
                              << int(prepareError.code) << prepareError.text
                              << int(runtimeError.code) << runtimeError.text;
                  return 4;
              }
              prepare.reset();

              const auto opus = std::find_if(local->payloads.cbegin(), local->payloads.cend(), [](const auto &payload) {
                  return payload.name.compare(QLatin1String("opus"), Qt::CaseInsensitive) == 0
                      && payload.clockrate && *payload.clockrate == 48000;
              });
              if (opus == local->payloads.cend()) {
                  qCritical() << "Real backend did not negotiate Opus";
                  return 5;
              }

              bool applied = false;
              RTP::MediaError applyError;
              auto apply = session->applyNegotiation(
                  endpoint.get(), *local, *local,
                  [&](RTP::MediaOperation::Id, RTP::MediaError error) {
                      applyError = std::move(error);
                      applied    = true;
                  });
              if (!apply || !waitUntil([&] { return applied || runtimeFailed; }, 10000) || runtimeFailed
                  || applyError) {
                  qCritical() << "Real-backend RTP apply failed"
                              << int(applyError.code) << applyError.text
                              << int(runtimeError.code) << runtimeError.text;
                  return 6;
              }
              apply.reset();

              std::vector<QByteArray> rtcpPackets;
              if (!endpoint->attachPacketIo([&](QByteArray packet, RTP::SrtpContext::Packet kind) {
                      if (kind == RTP::SrtpContext::Packet::Rtcp)
                          rtcpPackets.push_back(std::move(packet));
                      return true;
                  })) {
                  qCritical() << "Production Psi media endpoint refused packet I/O";
                  return 7;
              }

              constexpr quint32 RemoteSsrc = 0x44556677;
              for (quint16 sequence = 1; sequence <= 4; ++sequence) {
                  endpoint->receivePacket(
                      makeOpusRtp(sequence, 48000u + quint32(sequence - 1) * 960u, RemoteSsrc, opus->id),
                      RTP::SrtpContext::Packet::Rtp);
              }

              if (!waitUntil([&] {
                      if (runtimeFailed)
                          return true;
                      for (const auto &packet : rtcpPackets) {
                          if (containsReceiverReport(packet))
                              return true;
                      }
                      return false;
                  }, 12000)
                  || runtimeFailed) {
                  qCritical() << "Production Psi adapter did not return an RTCP receiver report"
                              << int(runtimeError.code) << runtimeError.text;
                  return 8;
              }

              endpoint->stop();
              endpoint.reset();
              session.reset();
          
              qInfo() << "Psi native media adapter real-backend RTP/RTCP smoke passed";
              return 0;
          }
          EOF

          cat > _psimedia-smoke/native_media_peer_smoke.cpp <<'EOF'
          #include "gstprovider.h"
          #include "psimedia.h"
          #include "psimediajingle.h"

          #include <iris/ice176.h>
          #include <iris/jingle-ice.h>
          #include <iris/jingle-rtp.h>
          #include <iris/jingle-session.h>
          #include <iris/xmpp_client.h>
          #include <iris/xmpp_task.h>

          #include <QCoreApplication>
          #include <QDebug>
          #include <QElapsedTimer>
          #include <QEventLoop>
          #include <QHostAddress>
          #include <QTimer>

          #include <memory>
          #include <optional>
          #include <utility>

          using namespace XMPP;
          namespace J = XMPP::Jingle;
          namespace RTP = XMPP::Jingle::RTP;

          static void check(bool ok, const char *message)
          {
              if (!ok)
                  qFatal("%s", message);
          }

          template<typename Predicate> bool waitUntil(Predicate predicate, int timeoutMs)
          {
              QElapsedTimer timer;
              timer.start();
              while (timer.elapsed() < timeoutMs) {
                  QCoreApplication::processEvents(QEventLoop::AllEvents, 20);
                  if (predicate())
                      return true;
              }
              QCoreApplication::processEvents(QEventLoop::AllEvents);
              return predicate();
          }

          class Ack final : public Task {
          public:
              explicit Ack(Task *parent) : Task(parent) { setSuccess(); }
          };

          struct ReceivedPacket {
              QByteArray bytes;
              RTP::SrtpContext::Packet kind = RTP::SrtpContext::Packet::Rtp;
          };

          struct FakeMediaState {
              RTP::MediaEndpoint::PacketWriter writer;
              QList<ReceivedPacket> received;
              int configured = 0;
              int attached   = 0;
          };

          class FakeEndpoint final : public RTP::MediaEndpoint {
          public:
              explicit FakeEndpoint(std::shared_ptr<FakeMediaState> state) : state_(std::move(state)) { }

              RTP::Description localOffer() const override
              {
                  RTP::Description description;
                  description.media   = QStringLiteral("audio");
                  description.rtcpMux = true;
                  RTP::PayloadType opus;
                  opus.id        = 111;
                  opus.name      = QStringLiteral("opus");
                  opus.clockrate = 48000;
                  opus.channels  = 2;
                  description.payloads.append(opus);
                  return description;
              }

              std::optional<RTP::Description> makeAnswer(const RTP::Description &remote) const override
              {
                  return remote;
              }

              bool acceptsAnswer(const RTP::Description &, const RTP::Description &) const override { return true; }

              bool configure(const RTP::Description &, const RTP::Description &) override
              {
                  ++state_->configured;
                  return true;
              }

              bool supportsPacketIo() const override { return true; }

              bool attachPacketIo(PacketWriter writer) override
              {
                  ++state_->attached;
                  state_->writer = std::move(writer);
                  return true;
              }

              void receivePacket(const QByteArray &bytes, RTP::SrtpContext::Packet kind) override
              {
                  state_->received.append({ bytes, kind });
              }

              void stop() override { state_->writer = {}; }

          private:
              std::shared_ptr<FakeMediaState> state_;
          };

          class FakeMediaSession final : public RTP::MediaSession {
          public:
              explicit FakeMediaSession(std::shared_ptr<FakeMediaState> state) : state_(std::move(state)) { }

              std::unique_ptr<RTP::MediaEndpoint> createEndpoint(const QString &, const QString &media) override
              {
                  if (media != QLatin1String("audio"))
                      return {};
                  return std::make_unique<FakeEndpoint>(state_);
              }

          private:
              std::shared_ptr<FakeMediaState> state_;
          };

          class FakeProvider final : public RTP::MediaProvider {
          public:
              explicit FakeProvider(std::shared_ptr<FakeMediaState> state) : state_(std::move(state)) { }

              std::unique_ptr<RTP::MediaSession> createSession() override
              {
                  return std::make_unique<FakeMediaSession>(state_);
              }

              QStringList mediaTypes() const override { return { QStringLiteral("audio") }; }

          private:
              std::shared_ptr<FakeMediaState> state_;
          };

          QByteArray makeOpusRtp(quint16 sequence, quint32 timestamp, quint32 ssrc, quint8 payloadType)
          {
              QByteArray packet(15, char(0));
              auto *p = reinterpret_cast<uchar *>(packet.data());
              p[0]  = 0x80;
              p[1]  = payloadType & 0x7f;
              p[2]  = uchar(sequence >> 8);
              p[3]  = uchar(sequence);
              p[4]  = uchar(timestamp >> 24);
              p[5]  = uchar(timestamp >> 16);
              p[6]  = uchar(timestamp >> 8);
              p[7]  = uchar(timestamp);
              p[8]  = uchar(ssrc >> 24);
              p[9]  = uchar(ssrc >> 16);
              p[10] = uchar(ssrc >> 8);
              p[11] = uchar(ssrc);
              p[12] = 0xf8;
              p[13] = 0xff;
              p[14] = 0xfe;
              return packet;
          }

          bool containsReceiverReport(const QByteArray &compound)
          {
              const auto *bytes = reinterpret_cast<const uchar *>(compound.constData());
              int offset = 0;
              while (offset + 4 <= compound.size()) {
                  const auto *packet = bytes + offset;
                  if ((packet[0] >> 6) != 2)
                      return false;
                  const int packetBytes = (int(packet[2]) * 256 + int(packet[3]) + 1) * 4;
                  if (packetBytes < 4 || offset + packetBytes > compound.size())
                      return false;
                  if (packet[1] == 201)
                      return true;
                  offset += packetBytes;
              }
              return false;
          }

          int main(int argc, char **argv)
          {
              QCoreApplication app(argc, argv);
              QCA::Initializer qca;

              PsiMedia::GstProvider gstProvider;
              check(gstProvider.isInitialized(), "GstProvider failed to initialize");
              PsiMedia::setProvider(&gstProvider);

              PsiMediaJingleCapabilities capabilities;
              capabilities.backendAvailable = true;
              capabilities.probeComplete    = true;
              capabilities.secureRtp        = true;
              capabilities.audio            = true;
              auto realProvider = makePsiMediaJingleProvider(capabilities);
              check(realProvider && realProvider->mediaTypes().contains(QStringLiteral("audio")),
                    "real Psi media provider did not expose audio");

              auto fakeState    = std::make_shared<FakeMediaState>();
              auto fakeProvider = std::make_shared<FakeProvider>(fakeState);

              const QString transportNs = J::ICE::NS;
              TcpPortReserver reserver;
              Client firstClient, secondClient;
              firstClient.setTcpPortReserver(&reserver);
              secondClient.setTcpPortReserver(&reserver);
              J::Session firstSession(firstClient.jingleManager(), Jid("second@example.test/device"),
                                      J::Origin::Initiator);
              J::Session secondSession(secondClient.jingleManager(), Jid("first@example.test/device"),
                                       J::Origin::Responder);
              firstClient.jingleICEManager()->setSelfAddress(QHostAddress::LocalHost);
              secondClient.jingleICEManager()->setSelfAddress(QHostAddress::LocalHost);

              auto makeTransport = [&](Client &client, J::Session &session, J::Origin creator) {
                  auto rawPad = client.jingleManager()->transportPad(&session, transportNs);
                  check(rawPad, "ICE transport pad unavailable");
                  J::TransportManagerPad::Ptr pad(rawPad);
                  auto base = pad->manager()->newTransport(pad, creator);
                  auto ice  = qSharedPointerDynamicCast<J::ICE::Transport>(base);
                  check(bool(ice), "ICE transport creation failed");
                  return ice;
              };
              auto first  = makeTransport(firstClient, firstSession, J::Origin::Initiator);
              auto second = makeTransport(secondClient, secondSession, J::Origin::Initiator);

              auto makeApp = [&](Client &client, J::Session &session, std::shared_ptr<RTP::MediaProvider> provider) {
                  auto pad = QSharedPointer<RTP::Pad>::create(client.jingleManager()->rtpManager(), &session,
                                                              std::move(provider), QStringList { transportNs });
                  return std::make_unique<RTP::Application>(pad, QStringLiteral("audio"), J::Origin::Initiator,
                                                             J::Origin::Both);
              };
              auto firstApp  = makeApp(firstClient, firstSession, fakeProvider);
              auto secondApp = makeApp(secondClient, secondSession, realProvider);
              check(firstApp->initializeOutgoing(QStringLiteral("audio")), "fake-side RTP offer initialization failed");
              check(firstApp->setTransport(first) && secondApp->setTransport(second),
                    "RTP application rejected ICE transport");

              QEventLoop loop;
              QTimer tick, deadline;
              deadline.setSingleShot(true);
              QObject::connect(&deadline, &QTimer::timeout, &loop, &QEventLoop::quit);

              bool failed = false;
              auto fail = [&]() {
                  failed = true;
                  loop.quit();
              };
              QObject::connect(first.data(), &J::Transport::failed, &loop, fail);
              QObject::connect(second.data(), &J::Transport::failed, &loop, fail);

              bool offerDelivered = false;
              bool secondPrepared = false;
              bool offered = false;
              bool answered = false;
              bool started = false;
              bool sent = false;
              bool replied = false;

              auto exchange = [&](J::ICE::Transport *from, J::ICE::Transport *to) {
                  if (!from->hasUpdates())
                      return false;
                  auto [xml, ack] = from->takeOutgoingUpdate(false);
                  check(!xml.isNull() && xml.namespaceURI() == transportNs, "wrong ICE wire namespace");
                  check(to->update(xml), "ICE signaling update rejected");
                  if (ack) {
                      Ack result(from->pad()->session()->manager()->client()->rootTask());
                      ack(&result);
                  }
                  return true;
              };

              QObject::connect(&tick, &QTimer::timeout, &loop, [&]() {
                  if (firstApp->state() >= J::State::Finishing || secondApp->state() >= J::State::Finishing) {
                      fail();
                      return;
                  }

                  if (!offerDelivered && firstApp->localDescription()) {
                      check(secondApp->setRemoteOffer(firstApp->makeLocalOffer()) == J::Application::Ok,
                            "real-side RTP offer rejected");
                      offerDelivered = true;
                  }

                  offered = exchange(first.data(), second.data()) || offered;
                  if (offered && second->state() == J::State::Pending && !secondPrepared) {
                      secondPrepared = true;
                      firstApp->setState(J::State::Pending);
                      secondApp->setState(J::State::Pending);
                      secondApp->prepare();
                  }

                  answered = exchange(second.data(), first.data()) || answered;
                  if (answered && secondApp->localDescription() && !started) {
                      started = true;
                      QTimer::singleShot(0, &loop, [&]() {
                          check(firstApp->setRemoteAnswer(secondApp->makeLocalAnswer()) == J::Application::Ok,
                                "real-side RTP answer rejected");
                          secondApp->setState(J::State::Accepted);
                          firstApp->start();
                          secondApp->start();
                      });
                  }

                  auto firstSrtp = first->rtpSession();
                  auto secondSrtp = second->rtpSession();
                  if (!sent && started && firstSrtp && secondSrtp && firstSrtp->isReady() && secondSrtp->isReady()
                      && firstApp->state() == J::State::Active && secondApp->state() == J::State::Active) {
                      check(fakeState->configured == 1 && fakeState->attached == 1 && bool(fakeState->writer),
                            "fake peer media was not attached exactly once");

                      const auto local = firstApp->localDescription();
                      check(local && !local->payloads.isEmpty(), "active fake peer lost negotiated RTP payload");
                      const quint8 pt = quint8(local->payloads.constFirst().id);
                      constexpr quint32 RemoteSsrc = 0x11223344;
                      for (quint16 sequence = 1; sequence <= 4; ++sequence) {
                          const auto rtp = makeOpusRtp(sequence, 48000u + quint32(sequence - 1) * 960u, RemoteSsrc, pt);
                          check(fakeState->writer(rtp, RTP::SrtpContext::Packet::Rtp),
                                "fake peer RTP writer failed after SRTP activation");
                      }
                      sent = true;
                  }

                  if (sent) {
                      for (const auto &packet : fakeState->received) {
                          if (packet.kind == RTP::SrtpContext::Packet::Rtcp && containsReceiverReport(packet.bytes)) {
                              replied = true;
                              loop.quit();
                              return;
                          }
                      }
                  }
              });

              firstApp->prepare();
              tick.start(5);
              deadline.start(20000);
              loop.exec();
              tick.stop();

              if (!replied)
                  qWarning() << "native peer smoke state" << failed << offered << answered << started << sent
                             << int(firstApp->state()) << int(secondApp->state())
                             << fakeState->received.size();
              check(!failed && replied, "real Psi media peer did not return RTCP over ICE/DTLS/SRTP");

              // P1c consent gate: only after negotiation and authenticated
              // packet readiness do we attach a real capture source and start
              // the production psimedia sender. The opposite peer remains a
              // fake media endpoint so the process still owns only one real
              // psimedia backend.
              const auto realLocal = secondApp->localDescription();
              check(realLocal && !realLocal->payloads.isEmpty(),
                    "real peer lost negotiated payload before consent");
              const quint8 realPayloadType = quint8(realLocal->payloads.constFirst().id);

              fakeState->received.clear();
              check(startPsiMediaJingleTransmit(&secondSession, true, true,
                                                QStringLiteral("audiotestsrc is-live=true wave=sine"),
                                                false, QString()),
                    "consent did not start real psimedia audio capture/transmit");

              auto realRtpCount = [&]() {
                  int count = 0;
                  for (const auto &packet : fakeState->received) {
                      if (packet.kind == RTP::SrtpContext::Packet::Rtp)
                          ++count;
                  }
                  return count;
              };
              check(waitUntil([&] { return realRtpCount() >= 4; }, 10000),
                    "real psimedia sender produced no RTP after consent");

              bool payloadMatched = false;
              for (const auto &packet : fakeState->received) {
                  if (packet.kind != RTP::SrtpContext::Packet::Rtp || packet.bytes.size() < 2)
                      continue;
                  const auto *bytes = reinterpret_cast<const uchar *>(packet.bytes.constData());
                  if ((bytes[0] >> 6) == 2 && (bytes[1] & 0x7f) == realPayloadType) {
                      payloadMatched = true;
                      break;
                  }
              }
              check(payloadMatched, "real sender RTP payload type diverged from negotiated description");

              stopPsiMediaJingleTransmit(&secondSession);
              int lastRtpCount = realRtpCount();
              QElapsedTimer quiet, totalQuiet;
              quiet.start();
              totalQuiet.start();
              while (totalQuiet.elapsed() < 5000 && quiet.elapsed() < 500) {
                  QCoreApplication::processEvents(QEventLoop::AllEvents, 20);
                  const int current = realRtpCount();
                  if (current != lastRtpCount) {
                      lastRtpCount = current;
                      quiet.restart();
                  }
              }
              check(quiet.elapsed() >= 500, "real psimedia sender did not quiesce after consent was revoked");

              auto retainedWriter = fakeState->writer;
              firstApp->incomingContentModify(J::Origin::None);
              const auto local = firstApp->localDescription();
              check(local && !local->payloads.isEmpty(), "active peer lost description before direction check");
              const auto blocked = makeOpusRtp(20, 96000, 0x55667788, quint8(local->payloads.constFirst().id));
              check(!retainedWriter(blocked, RTP::SrtpContext::Packet::Rtp),
                    "senders=none allowed RTP through retained real-peer writer");

              const auto epoch = first->rtpSession()->epoch();
              first->stop();
              check(!first->rtpSession()->isReady(), "stopping peer transport retained SRTP keys");
              check(!first->sendRtpPacket(blocked, RTP::SrtpContext::Packet::Rtp, epoch),
                    "stopped peer transport accepted RTP");
              check(!retainedWriter(blocked, RTP::SrtpContext::Packet::Rtp),
                    "retained media writer survived transport stop");

              firstApp.reset();
              secondApp.reset();
              second->stop();
          
              qInfo() << "Psi real-backend peer ICE/DTLS/SRTP receive+RTCP smoke passed";
              return 0;
          }
          EOF

          ccache --zero-stats
          cmake -S _psimedia-smoke -B _psimedia-smoke-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPSI_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DPSIMEDIA_SOURCE_DIR="$GITHUB_WORKSPACE/_psimedia"

      - name: Build real provider, plugin and RTP session regressions
        run: |
          cmake --build _psimedia-smoke-build \
            --target gstprovidersrc mediaplugin psimedia_provider_smoke psi_native_media_adapter_smoke \
                     psi_native_media_peer_smoke \
                     psimedia_opusrtppay_test psimedia_rtpsessioncontext_sender_test \
                     psimedia_rtpsessionbridge_test psimedia_rtpsessionbridge_packets_test \
                     psimedia_rtpsessionbridge_periodic_test psimedia_rtpsessionbridge_backpressure_test \
            --parallel 4

      - name: Run provider and RTP session smoke
        env:
          QT_QPA_PLATFORM: offscreen
          G_DEBUG: fatal-criticals
        run: |
          ctest --test-dir _psimedia-smoke-build \
            -R '^(psimedia_(provider_smoke|opusrtppay|rtpsessioncontext_sender|rtpsessionbridge|rtpsessionbridge_packets|rtpsessionbridge_periodic|rtpsessionbridge_backpressure)|psi_native_media_(adapter|peer)_smoke)$' \
            --no-tests=error \
            --output-on-failure \
            -V \
            -j1

      - name: Show compiler cache stats
        if: always()
        run: ccache --show-stats
