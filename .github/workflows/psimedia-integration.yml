name: PsiMedia integration

on:
  push:
    branches:
      - master
    paths:
      - 'iris'
      - 'src/avcall/**'
      - 'src/psimedia/**'
      - 'plugins/include/psimediaprovider.h'
      - 'tests/avcall/**'
      - 'qa/integration/jingle-live/**'
      - '.github/workflows/psimedia-integration.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'iris'
      - 'src/avcall/**'
      - 'src/psimedia/**'
      - 'plugins/include/psimediaprovider.h'
      - 'tests/avcall/**'
      - 'qa/integration/jingle-live/**'
      - '.github/workflows/psimedia-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  QCA_TAG: v3.0.8
  IRIS_SRTP_REF: 9c09c899eafb403e4d96c2afd3958d8fa2e52f41
  PSIMEDIA_SRTP_REF: ce8df212f6f738e58c3ffe961899400f2131f782

concurrency:
  group: psimedia-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-qt6:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Psi
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout matching Iris SRTP branch
        uses: actions/checkout@v4
        with:
          repository: psi-im/iris
          ref: ${{ env.IRIS_SRTP_REF }}
          path: iris
          fetch-depth: 1

      - name: Checkout matching psimedia SRTP branch
        uses: actions/checkout@v4
        with:
          repository: psi-im/psimedia
          ref: ${{ env.PSIMEDIA_SRTP_REF }}
          path: _psimedia
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ccache \
            g++ \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            libssl-dev \
            libsrtp2-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-tools

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-psimedia-integration-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-psimedia-integration-ccache-

      - name: Install QCA3 release package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf qca-release qca3.zip
          mkdir qca-release
          gh release download "$QCA_TAG" --repo psi-im/qca \
            -p 'qca3-deb-ubuntu-24.04.zip' -O qca3.zip
          (cd qca-release && cmake -E tar xvf ../qca3.zip)
          test -n "$(find qca-release -type f -name '*.deb' -print -quit)"
          sudo apt-get install -y ./qca-release/*.deb

      - name: Record integration versions
        run: |
          echo "Psi: $(git rev-parse HEAD)"
          echo "Iris: $(git -C iris rev-parse HEAD)"
          echo "psimedia: $(git -C _psimedia rev-parse HEAD)"
          echo "QCA: psi-im/qca $QCA_TAG release package (qca-ossl)"
          qmake6 -v
          openssl version
          gst-launch-1.0 --version
          pkg-config --modversion gstreamer-1.0 gstreamer-rtp-1.0 libsrtp2

      - name: Configure integration smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _psimedia-smoke
          cat > _psimedia-smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.19)
          project(psimedia_integration_smoke LANGUAGES CXX)

          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_AUTOMOC ON)
          set(QT_DEFAULT_MAJOR_VERSION 6)
          set(BUILD_DEMO OFF CACHE BOOL "" FORCE)
          set(BUILD_PSIPLUGIN ON CACHE BOOL "" FORCE)
          set(PSIMEDIA_BUILD_TESTS ON CACHE BOOL "" FORCE)
          set(USE_PSI ON CACHE BOOL "" FORCE)
          set(MAIN_PROGRAM_NAME psi CACHE STRING "" FORCE)

          if(NOT DEFINED PSI_SOURCE_DIR OR NOT DEFINED PSIMEDIA_SOURCE_DIR)
              message(FATAL_ERROR "PSI_SOURCE_DIR and PSIMEDIA_SOURCE_DIR are required")
          endif()

          find_package(Qt6 REQUIRED COMPONENTS Core Gui Widgets Network Xml Test)

          enable_testing()
          set(PLUGINS_ROOT_DIR "${PSI_SOURCE_DIR}/plugins" CACHE STRING "" FORCE)

          set(IRIS_ENABLE_INSTALL OFF CACHE BOOL "" FORCE)
          set(IRIS_ENABLE_JINGLE_SCTP OFF CACHE BOOL "" FORCE)
          set(IRIS_ENABLE_OMEMO OFF CACHE BOOL "" FORCE)
          set(IRIS_BUNDLED_USRSCTP OFF CACHE BOOL "" FORCE)
          set(IRIS_BUNDLED_QCA OFF CACHE BOOL "" FORCE)
          set(IRIS_SYSTEM_QCA 3 CACHE STRING "" FORCE)
          set(USE_QT6 ON CACHE BOOL "" FORCE)
          add_subdirectory("${PSI_SOURCE_DIR}/iris" iris)

          add_subdirectory("${PSIMEDIA_SOURCE_DIR}" psimedia)

          add_library(psi_native_media_adapter STATIC
              "${PSI_SOURCE_DIR}/src/psimedia/psimedia.cpp"
              "${PSI_SOURCE_DIR}/src/psimedia/psimedia.h"
              "${PSI_SOURCE_DIR}/src/psimedia/psimedia_p.h"
              "${PSI_SOURCE_DIR}/src/avcall/psimediajingle.cpp"
              "${PSI_SOURCE_DIR}/src/avcall/psimediajingle.h"
          )
          target_compile_definitions(psi_native_media_adapter PRIVATE QT_GUI_LIB)
          target_include_directories(psi_native_media_adapter PUBLIC
              "${PSI_SOURCE_DIR}/src"
              "${PSI_SOURCE_DIR}/src/psimedia"
              "${PSI_SOURCE_DIR}/src/avcall"
              "${PSI_SOURCE_DIR}/plugins/include"
          )
          target_link_libraries(psi_native_media_adapter PUBLIC
              Iris::Iris
              Qt6::Core
              Qt6::Gui
              Qt6::Widgets
          )

          add_executable(psimedia_provider_smoke smoke.cpp)
          target_include_directories(psimedia_provider_smoke PRIVATE
              "${PSI_SOURCE_DIR}/plugins/include"
              "${PSIMEDIA_SOURCE_DIR}/gstprovider"
          )
          target_link_libraries(psimedia_provider_smoke PRIVATE gstprovidersrc Qt6::Core)

          add_test(NAME psimedia_provider_smoke COMMAND psimedia_provider_smoke)
          set_tests_properties(psimedia_provider_smoke PROPERTIES TIMEOUT 30)

          add_executable(psimedia_plugin_load_smoke plugin_load_smoke.cpp)
          target_include_directories(psimedia_plugin_load_smoke PRIVATE
              "${PSIMEDIA_SOURCE_DIR}/psimedia"
          )
          target_link_libraries(psimedia_plugin_load_smoke PRIVATE Qt6::Core)
          add_dependencies(psimedia_plugin_load_smoke mediaplugin)
          add_test(NAME psimedia_plugin_load_smoke
              COMMAND psimedia_plugin_load_smoke "$<TARGET_FILE:mediaplugin>")
          set_tests_properties(psimedia_plugin_load_smoke PROPERTIES TIMEOUT 30)

          add_executable(psi_native_media_adapter_smoke native_adapter_smoke.cpp)
          target_include_directories(psi_native_media_adapter_smoke PRIVATE
              "${PSI_SOURCE_DIR}/src/psimedia"
              "${PSI_SOURCE_DIR}/src/avcall"
              "${PSI_SOURCE_DIR}/plugins/include"
              "${PSIMEDIA_SOURCE_DIR}/gstprovider"
          )
          target_link_libraries(psi_native_media_adapter_smoke PRIVATE
              psi_native_media_adapter
              gstprovidersrc
              Iris::Iris
              Qt6::Core
          )
          add_test(NAME psi_native_media_adapter_smoke COMMAND psi_native_media_adapter_smoke)
          set_tests_properties(psi_native_media_adapter_smoke PROPERTIES TIMEOUT 30)

          add_executable(psi_backend_lifecycle_test
              "${PSI_SOURCE_DIR}/tests/avcall/backend-lifecycle/tst_backend_lifecycle.cpp"
          )
          target_include_directories(psi_backend_lifecycle_test PRIVATE
              "${PSI_SOURCE_DIR}/src/psimedia"
              "${PSI_SOURCE_DIR}/src/avcall"
              "${PSI_SOURCE_DIR}/plugins/include"
          )
          target_link_libraries(psi_backend_lifecycle_test PRIVATE
              psi_native_media_adapter
              Iris::Iris
              Qt6::Core
              Qt6::Test
          )
          add_test(NAME psi_backend_lifecycle_test COMMAND psi_backend_lifecycle_test)
          set_tests_properties(psi_backend_lifecycle_test PROPERTIES TIMEOUT 30)

          add_executable(psi_native_media_runtime_error_smoke runtime_error_smoke.cpp)
          target_include_directories(psi_native_media_runtime_error_smoke PRIVATE
              "${PSI_SOURCE_DIR}/src"
              "${PSI_SOURCE_DIR}/src/psimedia"
              "${PSI_SOURCE_DIR}/src/avcall"
              "${PSI_SOURCE_DIR}/plugins/include"
              "${PSIMEDIA_SOURCE_DIR}/gstprovider"
          )
          target_link_libraries(psi_native_media_runtime_error_smoke PRIVATE
              psi_native_media_adapter
              gstprovidersrc
              Iris::Iris
              Qt6::Core
              Qt6::Network
          )
          add_test(NAME psi_native_media_runtime_error_smoke COMMAND psi_native_media_runtime_error_smoke)
          set_tests_properties(psi_native_media_runtime_error_smoke PROPERTIES TIMEOUT 30)

          EOF

          cat > _psimedia-smoke/smoke.cpp <<'EOF'
          #include "gstprovider.h"
          #include "psimediaprovider.h"

          #include <QCoreApplication>
          #include <QDebug>

          static_assert(sizeof(PsiMedia::PRtpPacket::Type) == sizeof(int));
          static_assert(static_cast<int>(PsiMedia::PRtpPacket::Type::Rtp) == 0);
          static_assert(static_cast<int>(PsiMedia::PRtpPacket::Type::Rtcp) == 1);

          int main(int argc, char **argv)
          {
              QCoreApplication app(argc, argv);

              PsiMedia::GstProvider provider;
              if (!provider.isInitialized()) {
                  qCritical() << "GstProvider failed to initialize";
                  return 1;
              }

              auto *session = provider.createRtpSession();
              if (!session) {
                  qCritical() << "GstProvider returned a null RTP session";
                  return 2;
              }
              if (!session->qobject()) {
                  qCritical() << "GstProvider RTP session has no QObject facade";
                  delete session;
                  return 3;
              }
              if (qobject_cast<PsiMedia::SecureRtpSessionContext *>(session->qobject())) {
                  qCritical() << "Legacy RTP session falsely advertises the secure RTP IID";
                  delete session;
                  return 4;
              }
              delete session;

              auto *secureProvider = qobject_cast<PsiMedia::SecureRtpProvider *>(provider.qobject());
              if (!secureProvider || secureProvider->supportedSecureRtpProfiles().isEmpty()) {
                  qCritical() << "GstProvider did not expose usable secure RTP capability";
                  return 5;
              }

              auto *secureSession = secureProvider->createSecureRtpSession();
              if (!secureSession || !secureSession->qobject()
                  || !qobject_cast<PsiMedia::SecureRtpSessionContext *>(secureSession->qobject())
                  || !qobject_cast<PsiMedia::RtpSessionContext *>(secureSession->qobject())) {
                  qCritical() << "Secure RTP factory did not return a dual-interface media session";
                  delete secureSession;
                  return 6;
              }

              // Session ownership is caller-side and must end before provider/plugin unload.
              secureSession->setProtectedPacketHandler({});
              secureSession->setRuntimeErrorHandler({});
              delete secureSession;

              qInfo() << "Real psimedia provider and secure RTP ABI smoke passed";
              return 0;
          }
          EOF

          cat > _psimedia-smoke/plugin_load_smoke.cpp <<'EOF'
          #include "psimediaprovider.h"

          #include <QCoreApplication>
          #include <QDebug>
          #include <QFileInfo>
          #include <QJsonObject>
          #include <QPluginLoader>

          int main(int argc, char **argv)
          {
              QCoreApplication app(argc, argv);
              if (argc != 2) {
                  qCritical() << "Expected production psimedia plugin path";
                  return 1;
              }

              const QString pluginPath = QFileInfo(QString::fromLocal8Bit(argv[1])).absoluteFilePath();
              QPluginLoader loader(pluginPath);
              const auto metadata = loader.metaData();
              const QString iid = metadata.value(QStringLiteral("IID")).toString();
              if (iid != QLatin1String("org.psi-im.PsiMediaPlugin")) {
                  qCritical() << "Unexpected psimedia plugin IID" << iid << pluginPath;
                  return 2;
              }

              QObject *instance = loader.instance();
              if (!instance) {
                  qCritical() << "Could not load production psimedia plugin" << pluginPath << loader.errorString();
                  return 3;
              }

              auto *plugin = qobject_cast<PsiMedia::Plugin *>(instance);
              if (!plugin) {
                  qCritical() << "Loaded psimedia binary does not expose PsiMedia::Plugin"
                              << instance->metaObject()->className() << pluginPath;
                  return 4;
              }
              if (QString::fromLatin1(instance->metaObject()->className()) != QLatin1String("PsiMediaPlugin")) {
                  qCritical() << "Unexpected production psimedia plugin class"
                              << instance->metaObject()->className() << pluginPath;
                  return 5;
              }

              qInfo() << "Production psimedia plugin loaded through PsiMedia::Plugin"
                      << pluginPath << iid << instance->metaObject()->className();
              return 0;
          }
          EOF

          cat > _psimedia-smoke/native_adapter_smoke.cpp <<'EOF'
          #include "gstprovider.h"
          #include "psimedia.h"
          #include "psimediajingle.h"

          #include <iris/jingle-rtp.h>

          #include <QCoreApplication>
          #include <QDebug>
          #include <QElapsedTimer>
          #include <QEventLoop>
          #include <QThread>

          #include <algorithm>
          #include <optional>
          #include <utility>
          #include <vector>

          namespace RTP = XMPP::Jingle::RTP;

          template<typename Predicate> bool waitUntil(Predicate predicate, int timeoutMs)
          {
              QElapsedTimer timer;
              timer.start();
              while (timer.elapsed() < timeoutMs) {
                  QCoreApplication::processEvents(QEventLoop::AllEvents, 20);
                  if (predicate())
                      return true;
                  QThread::msleep(5);
              }
              QCoreApplication::processEvents(QEventLoop::AllEvents);
              return predicate();
          }

          QByteArray makeOpusRtp(quint16 sequence, quint32 timestamp, quint32 ssrc, quint8 payloadType)
          {
              QByteArray packet(15, char(0));
              auto *p = reinterpret_cast<uchar *>(packet.data());
              p[0]  = 0x80;
              p[1]  = payloadType & 0x7f;
              p[2]  = uchar(sequence >> 8);
              p[3]  = uchar(sequence);
              p[4]  = uchar(timestamp >> 24);
              p[5]  = uchar(timestamp >> 16);
              p[6]  = uchar(timestamp >> 8);
              p[7]  = uchar(timestamp);
              p[8]  = uchar(ssrc >> 24);
              p[9]  = uchar(ssrc >> 16);
              p[10] = uchar(ssrc >> 8);
              p[11] = uchar(ssrc);
              // Valid Opus comfort/silence frame used only to exercise the
              // receive pipeline without any physical playback device.
              p[12] = 0xf8;
              p[13] = 0xff;
              p[14] = 0xfe;
              return packet;
          }

          bool containsReceiverReport(const QByteArray &compound)
          {
              const auto *bytes = reinterpret_cast<const uchar *>(compound.constData());
              int offset = 0;
              while (offset + 4 <= compound.size()) {
                  const auto *packet = bytes + offset;
                  if ((packet[0] >> 6) != 2)
                      return false;
                  const int packetBytes = (int(packet[2]) * 256 + int(packet[3]) + 1) * 4;
                  if (packetBytes < 4 || offset + packetBytes > compound.size())
                      return false;
                  if (packet[1] == 201)
                      return true;
                  offset += packetBytes;
              }
              return false;
          }

          int main(int argc, char **argv)
          {
              QCoreApplication app(argc, argv);
              QCA::Initializer qca;

              PsiMedia::GstProvider gstProvider;
              if (!gstProvider.isInitialized()) {
                  qCritical() << "GstProvider failed to initialize";
                  return 1;
              }
              PsiMedia::setProvider(&gstProvider);

              PsiMediaJingleCapabilities capabilities;
              capabilities.backendAvailable = true;
              capabilities.probeComplete    = true;
              capabilities.secureRtp        = true;
              capabilities.audio            = true;
              capabilities.video            = true;

              auto provider = makePsiMediaJingleProvider(capabilities);
              if (!provider
                  || provider->mediaTypes()
                      != QStringList { QStringLiteral("audio"), QStringLiteral("video") }) {
                  qCritical() << "Psi native media provider did not expose audio+video";
                  return 2;
              }

              auto session = provider->createSession();
              auto audioEndpoint = session
                  ? session->createEndpoint(QStringLiteral("audio"), QStringLiteral("audio"))
                  : nullptr;
              auto videoEndpoint = session
                  ? session->createEndpoint(QStringLiteral("video"), QStringLiteral("video"))
                  : nullptr;
              if (!session || !audioEndpoint || !videoEndpoint) {
                  qCritical() << "Psi native media adapter did not create audio+video endpoints";
                  return 3;
              }

              bool runtimeFailed = false;
              RTP::MediaError runtimeError;
              QObject::connect(session.get(), &RTP::MediaSession::runtimeError,
                               [&](const RTP::MediaError &error) {
                                   runtimeFailed = true;
                                   runtimeError  = error;
                               });

              bool audioPrepared = false;
              bool videoPrepared = false;
              RTP::MediaError audioPrepareError;
              RTP::MediaError videoPrepareError;
              std::optional<RTP::Description> audioLocal;
              std::optional<RTP::Description> videoLocal;
              auto audioPrepare = session->prepareLocalOffer(
                  audioEndpoint.get(),
                  [&](RTP::MediaOperation::Id, std::optional<RTP::Description> description, RTP::MediaError error) {
                      audioLocal        = std::move(description);
                      audioPrepareError = std::move(error);
                      audioPrepared     = true;
                  });
              auto videoPrepare = session->prepareLocalOffer(
                  videoEndpoint.get(),
                  [&](RTP::MediaOperation::Id, std::optional<RTP::Description> description, RTP::MediaError error) {
                      videoLocal        = std::move(description);
                      videoPrepareError = std::move(error);
                      videoPrepared     = true;
                  });
              if (!audioPrepare || !videoPrepare
                  || !waitUntil([&] { return (audioPrepared && videoPrepared) || runtimeFailed; }, 10000)
                  || runtimeFailed || audioPrepareError || videoPrepareError || !audioLocal || !videoLocal
                  || audioLocal->media != QLatin1String("audio") || videoLocal->media != QLatin1String("video")
                  || !audioLocal->rtcpMux || !videoLocal->rtcpMux
                  || audioLocal->payloads.isEmpty() || videoLocal->payloads.isEmpty()) {
                  qCritical() << "Device-free real-backend audio+video RTP prepare failed"
                              << int(audioPrepareError.code) << audioPrepareError.text
                              << int(videoPrepareError.code) << videoPrepareError.text
                              << int(runtimeError.code) << runtimeError.text;
                  return 4;
              }
              audioPrepare.reset();
              videoPrepare.reset();

              const auto opus = std::find_if(
                  audioLocal->payloads.cbegin(), audioLocal->payloads.cend(), [](const auto &payload) {
                      return payload.name.compare(QLatin1String("opus"), Qt::CaseInsensitive) == 0
                          && payload.clockrate && *payload.clockrate == 48000;
                  });
              if (opus == audioLocal->payloads.cend()) {
                  qCritical() << "Real backend did not negotiate Opus";
                  return 5;
              }
              const auto vp8 = std::find_if(
                  videoLocal->payloads.cbegin(), videoLocal->payloads.cend(), [](const auto &payload) {
                      return payload.name.compare(QLatin1String("VP8"), Qt::CaseInsensitive) == 0
                          && payload.clockrate && *payload.clockrate == 90000;
                  });
              if (vp8 == videoLocal->payloads.cend()) {
                  qCritical() << "Real backend did not negotiate VP8";
                  return 6;
              }

              bool audioApplied = false;
              bool videoApplied = false;
              RTP::MediaError audioApplyError;
              RTP::MediaError videoApplyError;
              auto audioApply = session->applyNegotiation(
                  audioEndpoint.get(), *audioLocal, *audioLocal,
                  [&](RTP::MediaOperation::Id, RTP::MediaError error) {
                      audioApplyError = std::move(error);
                      audioApplied    = true;
                  });
              auto videoApply = session->applyNegotiation(
                  videoEndpoint.get(), *videoLocal, *videoLocal,
                  [&](RTP::MediaOperation::Id, RTP::MediaError error) {
                      videoApplyError = std::move(error);
                      videoApplied    = true;
                  });
              if (!audioApply || !videoApply
                  || !waitUntil([&] { return (audioApplied && videoApplied) || runtimeFailed; }, 10000)
                  || runtimeFailed || audioApplyError || videoApplyError) {
                  qCritical() << "Real-backend audio+video RTP apply failed"
                              << int(audioApplyError.code) << audioApplyError.text
                              << int(videoApplyError.code) << videoApplyError.text
                              << int(runtimeError.code) << runtimeError.text;
                  return 7;
              }
              audioApply.reset();
              videoApply.reset();

              if (!session->attachSecureRtpPacketIo([](const RTP::SecureRtpPacket &) { return true; })) {
                  qCritical() << "Production Psi media session refused protected packet I/O";
                  return 8;
              }

              RTP::SecureRtpEndpoint audioRoute;
              audioRoute.endpointId    = QByteArrayLiteral("audio");
              audioRoute.associationId = QByteArrayLiteral("audio-association");
              audioRoute.media         = QStringLiteral("audio");
              for (const auto &payload : audioLocal->payloads)
                  audioRoute.incomingPayloadTypes.insert(payload.id);

              RTP::SecureRtpEndpoint videoRoute;
              videoRoute.endpointId    = QByteArrayLiteral("video");
              videoRoute.associationId = QByteArrayLiteral("video-association");
              videoRoute.media         = QStringLiteral("video");
              for (const auto &payload : videoLocal->payloads)
                  videoRoute.incomingPayloadTypes.insert(payload.id);

              if (!session->configureSecureRtpEndpoints({ audioRoute, videoRoute })) {
                  qCritical() << "Production Psi media session rejected secure endpoint routing";
                  return 9;
              }

              const auto profiles = provider->secureRtpProfiles();
              if (profiles.isEmpty()) {
                  qCritical() << "Production Psi media provider exposed no secure RTP profiles";
                  return 10;
              }
              const QString profile = profiles.contains(QStringLiteral("SRTP_AES128_CM_HMAC_SHA1_80"))
                  ? QStringLiteral("SRTP_AES128_CM_HMAC_SHA1_80")
                  : profiles.first();
              const int keyBytes
                  = profile == QLatin1String("SRTP_AEAD_AES_256_GCM") ? 32 : 16;
              const int saltBytes
                  = profile.contains(QLatin1String("GCM")) ? 12 : 14;

              auto configureAssociation = [&](const QByteArray &id, quint64 epoch, char localFill, char remoteFill) {
                  RTP::SecureRtpParameters parameters;
                  parameters.associationId   = id;
                  parameters.epoch           = epoch;
                  parameters.profile         = profile;
                  parameters.localMasterKey  = QCA::SecureArray(QByteArray(keyBytes, localFill));
                  parameters.localMasterSalt = QCA::SecureArray(QByteArray(saltBytes, localFill + 1));
                  parameters.remoteMasterKey = QCA::SecureArray(QByteArray(keyBytes, remoteFill));
                  parameters.remoteMasterSalt= QCA::SecureArray(QByteArray(saltBytes, remoteFill + 1));
                  return session->configureSecureRtpAssociation(parameters);
              };
              if (!configureAssociation(audioRoute.associationId, 1, 'a', 'c')
                  || !configureAssociation(videoRoute.associationId, 1, 'e', 'g')) {
                  qCritical() << "Production Psi adapter rejected valid SRTP association material" << profile;
                  return 11;
              }

              RTP::SecureRtpPacket unauthenticated;
              unauthenticated.associationId = audioRoute.associationId;
              unauthenticated.epoch         = 1;
              unauthenticated.kind          = RTP::PacketKind::Rtp;
              unauthenticated.data          = makeOpusRtp(1, 48000, 0x44556677, opus->id);
              if (session->receiveProtectedRtpPacket(unauthenticated)) {
                  qCritical() << "Production Psi adapter accepted plaintext as protected SRTP";
                  return 12;
              }

              session->invalidateSecureRtpAssociation(audioRoute.associationId, 1);
              session->invalidateSecureRtpAssociation(videoRoute.associationId, 1);
              session->detachSecureRtpPacketIo();

              audioEndpoint->stop();
              videoEndpoint->stop();
              audioEndpoint.reset();
              videoEndpoint.reset();
              session.reset();

              qInfo() << "Psi native media adapter real-backend audio/video negotiation + RTP/RTCP smoke passed";
              return 0;
          }
          EOF

          cat > _psimedia-smoke/runtime_error_smoke.cpp <<'EOF'
          #include "gstprovider.h"
          #include "psimedia.h"
          #include "psimediajingle.h"

          #include <iris/jingle-rtp.h>
          #include <iris/jingle-session.h>
          #include <iris/xmpp_client.h>

          #include <QCoreApplication>
          #include <QDebug>
          #include <QElapsedTimer>
          #include <QEventLoop>

          #include <optional>

          using namespace XMPP;
          namespace J = XMPP::Jingle;
          namespace RTP = XMPP::Jingle::RTP;

          static void check(bool ok, const char *message)
          {
              if (!ok)
                  qFatal("%s", message);
          }

          template<typename Predicate> bool waitUntil(Predicate predicate, int timeoutMs)
          {
              QElapsedTimer timer;
              timer.start();
              while (timer.elapsed() < timeoutMs) {
                  QCoreApplication::processEvents(QEventLoop::AllEvents, 20);
                  if (predicate())
                      return true;
              }
              QCoreApplication::processEvents(QEventLoop::AllEvents);
              return predicate();
          }

          int main(int argc, char **argv)
          {
              QCoreApplication app(argc, argv);

              PsiMedia::GstProvider gstProvider;
              check(gstProvider.isInitialized(), "GstProvider failed to initialize");
              PsiMedia::setProvider(&gstProvider);

              PsiMediaJingleCapabilities capabilities;
              capabilities.backendAvailable = true;
              capabilities.probeComplete    = true;
              capabilities.secureRtp        = true;
              capabilities.audio            = true;
              auto provider = makePsiMediaJingleProvider(capabilities);
              check(provider && provider->mediaTypes() == QStringList { QStringLiteral("audio") },
                    "real Psi media provider did not expose audio");

              Client client;
              J::Session jingleSession(client.jingleManager(), Jid("peer@example.test/device"),
                                       J::Origin::Initiator);
              auto *rtpManager = client.jingleManager()->rtpManager();
              rtpManager->setMediaProvider(provider);

              auto basePad = jingleSession.applicationPadFactory(RTP::Description::ns());
              auto pad = qSharedPointerDynamicCast<RTP::Pad>(basePad);
              check(bool(pad) && pad->mediaSession(), "registered real RTP media session unavailable");
              auto *media = pad->mediaSession();
              auto endpoint = media->createEndpoint(QStringLiteral("runtime-audio"), QStringLiteral("audio"));
              check(bool(endpoint), "real RTP runtime-error endpoint unavailable");

              int runtimeErrors = 0;
              RTP::MediaError runtimeError;
              QObject::connect(media, &RTP::MediaSession::runtimeError,
                               [&](const RTP::MediaError &error) {
                                   ++runtimeErrors;
                                   runtimeError = error;
                               });

              bool prepared = false;
              RTP::MediaError prepareError;
              std::optional<RTP::Description> local;
              auto prepare = media->prepareLocalOffer(
                  endpoint.get(),
                  [&](RTP::MediaOperation::Id, std::optional<RTP::Description> description,
                      RTP::MediaError error) {
                      local = std::move(description);
                      prepareError = std::move(error);
                      prepared = true;
                  });
              check(bool(prepare), "real backend runtime-error prepare did not start");
              check(waitUntil([&] { return prepared || runtimeErrors; }, 10000),
                    "real backend runtime-error prepare timed out");
              check(runtimeErrors == 0 && !prepareError && local && !local->payloads.isEmpty(),
                    "real backend runtime-error prepare failed");

              bool applied = false;
              RTP::MediaError applyError;
              auto apply = media->applyNegotiation(
                  endpoint.get(), *local, *local,
                  [&](RTP::MediaOperation::Id, RTP::MediaError error) {
                      applyError = std::move(error);
                      applied = true;
                  });
              check(bool(apply), "real backend runtime-error apply did not start");
              check(waitUntil([&] { return applied || runtimeErrors; }, 10000),
                    "real backend runtime-error apply timed out");
              check(runtimeErrors == 0 && !applyError,
                    "real backend runtime-error apply failed before stimulus");

              check(media->attachSecureRtpPacketIo([](const RTP::SecureRtpPacket &) { return true; }),
                    "real backend runtime-error media session refused protected packet I/O");

              // Cross the actual psimedia device-update boundary with a source
              // string that GStreamer cannot instantiate. The helper returns
              // true initially because capture was requested; the asynchronous
              // provider failure must then become exactly one terminal
              // MediaSession::runtimeError and revoke endpoint packet I/O.
              check(startPsiMediaJingleTransmit(
                        &jingleSession, true, true,
                        QStringLiteral("psi_nonexistent_capture_src_20260919"), false, QString()),
                    "runtime-error stimulus did not request real backend capture");
              check(waitUntil([&] { return runtimeErrors > 0; }, 10000),
                    "real psimedia capture failure did not reach MediaSession::runtimeError");
              check(runtimeErrors == 1 && runtimeError.code == RTP::MediaError::Code::Backend,
                    "real psimedia capture failure produced wrong or duplicate runtime error");

              check(!media->attachSecureRtpPacketIo([](const RTP::SecureRtpPacket &) { return true; }),
                    "failed real backend allowed protected packet I/O to be reattached");
              check(!startPsiMediaJingleTransmit(
                        &jingleSession, true, true,
                        QStringLiteral("audiotestsrc is-live=true wave=sine"), false, QString()),
                    "failed real backend resumed capture after terminal error");

              endpoint->stop();
              endpoint.reset();
              apply.reset();
              prepare.reset();

              qInfo() << "Psi real-backend runtime-error propagation and endpoint revocation smoke passed";
              return 0;
          }
          EOF

          ccache --zero-stats
          cmake -S _psimedia-smoke -B _psimedia-smoke-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPSI_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DPSIMEDIA_SOURCE_DIR="$GITHUB_WORKSPACE/_psimedia"

      - name: Build real provider, plugin and RTP session regressions
        run: |
          cmake --build _psimedia-smoke-build \
            --target gstprovidersrc mediaplugin psimedia_provider_smoke psimedia_plugin_load_smoke \
                     psi_native_media_adapter_smoke psi_backend_lifecycle_test \
                     psi_native_media_runtime_error_smoke \
                     psimedia_opusrtppay_test psimedia_rtpworker_receive_order_test psimedia_rtpworker_send_order_test \
                     psimedia_videoprep_test psimedia_video_capture_caps_test psimedia_rtpsessioncontext_sender_test \
                     psimedia_rtpsessionbridge_test psimedia_rtpsessionbridge_packets_test \
                     psimedia_rtpsessionbridge_periodic_test psimedia_rtpsessionbridge_backpressure_test \
            --parallel 4

      - name: Run provider and RTP session smoke
        env:
          QT_QPA_PLATFORM: offscreen
          G_DEBUG: fatal-criticals
        run: |
          ctest --test-dir _psimedia-smoke-build \
            -R '^(psimedia_(provider_smoke|plugin_load_smoke|opusrtppay|rtpworker_receive_order|rtpworker_send_order|videoprep|video_capture_caps|rtpsessioncontext_sender|rtpsessionbridge|rtpsessionbridge_packets|rtpsessionbridge_periodic|rtpsessionbridge_backpressure)|psi_(backend_lifecycle_test|native_media_(adapter|runtime_error)_smoke))$' \
            --no-tests=error \
            --output-on-failure \
            -V \
            -j1

      - name: Show compiler cache stats
        if: always()
        run: ccache --show-stats

  xmpp-prosody-ft:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Psi
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout matching Iris SRTP branch
        uses: actions/checkout@v4
        with:
          repository: psi-im/iris
          ref: ${{ env.IRIS_SRTP_REF }}
          path: iris
          fetch-depth: 1

      - name: Install XMPP live-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            libssl-dev \
            libusrsctp-dev \
            zlib1g-dev \
            prosody
          sudo systemctl stop prosody.service 2>/dev/null || true
          sudo service prosody stop 2>/dev/null || true

      - name: Install QCA3 release package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf qca-release qca3.zip
          mkdir qca-release
          gh release download "$QCA_TAG" --repo psi-im/qca \
            -p 'qca3-deb-ubuntu-24.04.zip' -O qca3.zip
          (cd qca-release && cmake -E tar xvf ../qca3.zip)
          test -n "$(find qca-release -type f -name '*.deb' -print -quit)"
          sudo apt-get install -y ./qca-release/*.deb

      - name: Build SCTP-enabled Jingle FT client
        shell: bash
        run: |
          set -euo pipefail
          cmake -S qa/integration/jingle-live -B _jingle-live-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPSI_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DJINGLE_LIVE_ENABLE_FT=ON
          cmake --build _jingle-live-build --target psi_jingle_ft_live_client --parallel 4

      - name: Start local Prosody
        shell: bash
        run: |
          set -euo pipefail
          export PROSODY_DATA_DIR="$RUNNER_TEMP/prosody-data"
          export PROSODY_PID_FILE="$RUNNER_TEMP/prosody.pid"
          mkdir -p "$PROSODY_DATA_DIR"
          cfg="$GITHUB_WORKSPACE/qa/integration/jingle-live/prosody.cfg.lua"
          mkdir -p "$(dirname "$cfg")/certs"
          prosodyctl --config "$cfg" check config
          prosodyctl --config "$cfg" register user01 localhost ci-pass-01
          prosodyctl --config "$cfg" register user02 localhost ci-pass-02
          prosody -F --config "$cfg" >"$RUNNER_TEMP/prosody-live.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/prosody-live.pid"
          for i in $(seq 1 100); do
            if (echo > /dev/tcp/127.0.0.1/5222) 2>/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/prosody-live.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/prosody-live.log"
              exit 1
            fi
            sleep 0.1
          done
          cat "$RUNNER_TEMP/prosody-live.log"
          exit 1

      - name: Transfer deterministic file through Prosody transport matrix
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/jingle-ft-input.bin"
          bin="$GITHUB_WORKSPACE/_jingle-live-build/psi_jingle_ft_live_client"
          python3 - "$input" <<'PY'
          import sys
          path = sys.argv[1]
          data = bytes(((i * 37 + 11) & 0xff) for i in range(256 * 1024))
          with open(path, 'wb') as f:
              f.write(data)
          PY

          run_case() {
            local case_name="$1"
            local profile="$2"
            local expected_initial="$3"
            local expected_active="$4"
            local expect_replace="$5"
            local output="$RUNNER_TEMP/jingle-ft-${case_name}.bin"
            local ready="$RUNNER_TEMP/jingle-ft-${case_name}.ready"
            local receiver_log="$RUNNER_TEMP/jingle-ft-${case_name}-receiver.log"
            local sender_log="$RUNNER_TEMP/jingle-ft-${case_name}-sender.log"
            local sender_jid="user01@localhost/ft-sender-${case_name}"
            local receiver_jid_requested="user02@localhost/ft-receiver-${case_name}"

            rm -f "$output" "$ready" "$receiver_log" "$sender_log"

            "$bin" receiver "$receiver_jid_requested" ci-pass-02               "$sender_jid" "$output" "$ready" "$profile" >"$receiver_log" 2>&1 &
            local receiver_pid=$!

            for i in $(seq 1 200); do
              if [[ -s "$ready" ]]; then
                break
              fi
              if ! kill -0 "$receiver_pid" 2>/dev/null; then
                cat "$receiver_log"
                return 1
              fi
              sleep 0.1
            done
            test -s "$ready"
            local receiver_jid
            receiver_jid="$(tr -d '\r\n' < "$ready")"

            set +e
            "$bin" sender "$sender_jid" ci-pass-01               "$receiver_jid" "$input" '' "$profile" >"$sender_log" 2>&1
            local sender_rc=$?
            if [[ "$sender_rc" -ne 0 ]]; then
              kill "$receiver_pid" 2>/dev/null || true
            fi
            wait "$receiver_pid"
            local receiver_rc=$?
            set -e

            echo "LIVE_FT_PROCESS_RC case=${case_name} sender=${sender_rc} receiver=${receiver_rc}"
            echo "--- ${case_name}: sender log ---"
            cat "$sender_log"
            echo "--- ${case_name}: receiver log ---"
            cat "$receiver_log"

            test "$sender_rc" -eq 0
            test "$receiver_rc" -eq 0
            grep -Fx "FT_PROFILE=$profile" "$sender_log"
            grep -Fx "FT_INITIAL_TRANSPORT=$expected_initial" "$sender_log"
            grep -Fx "FT_ACTIVE_TRANSPORT=$expected_active" "$sender_log"
            grep -Fx "FT_SENDER_DRAIN=finishing" "$sender_log"
            grep -Fx "FT_RECEIVER_DRAIN=finishing" "$receiver_log"
            grep -Fx "LIVE_FT_RESULT=success sender completed" "$sender_log"
            grep -Fx "LIVE_FT_RESULT=success receiver completed" "$receiver_log"

            if [[ "$expect_replace" == yes ]]; then
              grep -Fx "FT_REPLACE_FROM=$expected_initial" "$sender_log"
              grep -Fx "FT_REPLACE_SELECTED=$expected_active" "$sender_log"
              grep -Eq 'action="transport-replace"|action=.transport-replace.' "$sender_log"
              grep -Eq 'action="transport-replace"|action=.transport-replace.' "$receiver_log"
            else
              if grep -Eq 'action="transport-replace"|action=.transport-replace.' "$sender_log"; then
                echo "unexpected transport-replace in $case_name" >&2
                return 1
              fi
            fi

            cmp "$input" "$output"
            sha256sum "$input" "$output"
          }

          run_case ice ice             'urn:xmpp:jingle:transports:ice:0'             'urn:xmpp:jingle:transports:ice:0' no
          run_case s5b s5b             'urn:xmpp:jingle:transports:s5b:1'             'urn:xmpp:jingle:transports:s5b:1' no
          run_case ibb ibb             'urn:xmpp:jingle:transports:ibb:1'             'urn:xmpp:jingle:transports:ibb:1' no
          run_case ice-to-s5b ice-s5b-replace             'urn:xmpp:jingle:transports:ice:0'             'urn:xmpp:jingle:transports:s5b:1' yes
          run_case s5b-to-ibb s5b-ibb-replace             'urn:xmpp:jingle:transports:s5b:1'             'urn:xmpp:jingle:transports:ibb:1' yes

          run_truncated_source_case() {
            local case_name="ice-truncated-source"
            local profile="ice"
            local bad_input="$RUNNER_TEMP/jingle-ft-truncated-input.bin"
            local output="$RUNNER_TEMP/jingle-ft-${case_name}.bin"
            local ready="$RUNNER_TEMP/jingle-ft-${case_name}.ready"
            local receiver_log="$RUNNER_TEMP/jingle-ft-${case_name}-receiver.log"
            local sender_log="$RUNNER_TEMP/jingle-ft-${case_name}-sender.log"
            local sender_jid="user01@localhost/ft-sender-${case_name}"
            local receiver_jid_requested="user02@localhost/ft-receiver-${case_name}"

            cp "$input" "$bad_input"
            rm -f "$output" "$ready" "$receiver_log" "$sender_log"

            "$bin" receiver "$receiver_jid_requested" ci-pass-02 \
              "$sender_jid" "$output" "$ready" "$profile" >"$receiver_log" 2>&1 &
            local receiver_pid=$!

            for i in $(seq 1 200); do
              if [[ -s "$ready" ]]; then
                break
              fi
              if ! kill -0 "$receiver_pid" 2>/dev/null; then
                cat "$receiver_log"
                return 1
              fi
              sleep 0.1
            done
            test -s "$ready"
            local receiver_jid
            receiver_jid="$(tr -d '\r\n' < "$ready")"

            set +e
            PSI_JINGLE_FT_TEST_TRUNCATE_SOURCE=1 \
              "$bin" sender "$sender_jid" ci-pass-01 \
              "$receiver_jid" "$bad_input" '' "$profile" >"$sender_log" 2>&1
            local sender_rc=$?
            wait "$receiver_pid"
            local receiver_rc=$?
            set -e

            echo "LIVE_FT_PROCESS_RC case=${case_name} sender=${sender_rc} receiver=${receiver_rc}"
            echo "--- ${case_name}: sender log ---"
            cat "$sender_log"
            echo "--- ${case_name}: receiver log ---"
            cat "$receiver_log"

            test "$sender_rc" -ne 0
            test "$receiver_rc" -ne 0
            test "$sender_rc" -ne 124
            test "$receiver_rc" -ne 124
            grep -F "FT_TEST_SOURCE_TRUNCATED" "$sender_log"
            grep -F "LIVE_FT_RESULT=failure" "$sender_log"
            grep -F "LIVE_FT_RESULT=failure" "$receiver_log"
            grep -E 'action="content-remove"|action=.content-remove.' "$sender_log"
            grep -E 'action="content-remove"|action=.content-remove.' "$receiver_log"
            grep -F "failed-application" "$sender_log"
            grep -F "failed-application" "$receiver_log"

            if grep -Fq "LIVE_FT_RESULT=success" "$sender_log" || grep -Fq "LIVE_FT_RESULT=success" "$receiver_log"; then
              echo "truncated source was reported as successful" >&2
              return 1
            fi
          }

          run_truncated_source_case

      - name: Show Prosody log
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/prosody-live.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/prosody-live.pid")" 2>/dev/null || true
          fi
          if [[ -f "$RUNNER_TEMP/prosody-live.log" ]]; then
            tail -n 250 "$RUNNER_TEMP/prosody-live.log"
          fi


  xmpp-prosody-call:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Psi
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout matching Iris SRTP branch
        uses: actions/checkout@v4
        with:
          repository: psi-im/iris
          ref: ${{ env.IRIS_SRTP_REF }}
          path: iris
          fetch-depth: 1

      - name: Checkout matching psimedia SRTP branch
        uses: actions/checkout@v4
        with:
          repository: psi-im/psimedia
          ref: ${{ env.PSIMEDIA_SRTP_REF }}
          path: _psimedia
          fetch-depth: 1

      - name: Install audio-call live-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ ninja-build pkg-config qt6-base-dev \
            libssl-dev libsrtp2-dev libusrsctp-dev zlib1g-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-tools prosody
          sudo systemctl stop prosody.service 2>/dev/null || true
          sudo service prosody stop 2>/dev/null || true

      - name: Install QCA3 release package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf qca-release qca3.zip
          mkdir qca-release
          gh release download "$QCA_TAG" --repo psi-im/qca \
            -p 'qca3-deb-ubuntu-24.04.zip' -O qca3.zip
          (cd qca-release && cmake -E tar xvf ../qca3.zip)
          test -n "$(find qca-release -type f -name '*.deb' -print -quit)"
          sudo apt-get install -y ./qca-release/*.deb

      - name: Build real psimedia Jingle audio-call client
        shell: bash
        run: |
          set -euo pipefail
          cmake -S qa/integration/jingle-live -B _jingle-call-build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            -DPSI_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DPSIMEDIA_SOURCE_DIR="$GITHUB_WORKSPACE/_psimedia"
          cmake --build _jingle-call-build --target psi_jingle_call_live_client --parallel 4

      - name: Start local Prosody
        shell: bash
        run: |
          set -euo pipefail
          export PROSODY_DATA_DIR="$RUNNER_TEMP/prosody-data"
          export PROSODY_PID_FILE="$RUNNER_TEMP/prosody.pid"
          mkdir -p "$PROSODY_DATA_DIR"
          cfg="$GITHUB_WORKSPACE/qa/integration/jingle-live/prosody.cfg.lua"
          mkdir -p "$(dirname "$cfg")/certs"
          prosodyctl --config "$cfg" check config
          prosodyctl --config "$cfg" register user01 localhost ci-pass-01
          prosodyctl --config "$cfg" register user02 localhost ci-pass-02
          prosody -F --config "$cfg" >"$RUNNER_TEMP/prosody-call.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/prosody-call.pid"
          for i in $(seq 1 100); do
            if (echo > /dev/tcp/127.0.0.1/5222) 2>/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/prosody-call.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/prosody-call.log"
              exit 1
            fi
            sleep 0.1
          done
          cat "$RUNNER_TEMP/prosody-call.log"
          exit 1

      - name: Place bidirectional headless audio call through Prosody
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          G_DEBUG: fatal-criticals
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/_jingle-call-build/psi_jingle_call_live_client"
          ready="$RUNNER_TEMP/jingle-call.ready"
          caller_out="$RUNNER_TEMP/jingle-call-caller.raw"
          callee_out="$RUNNER_TEMP/jingle-call-callee.raw"
          caller_log="$RUNNER_TEMP/jingle-call-caller.log"
          callee_log="$RUNNER_TEMP/jingle-call-callee.log"
          caller_jid="user01@localhost/call-caller"
          callee_requested="user02@localhost/call-callee"

          rm -f "$ready" "$caller_out" "$callee_out" "$caller_log" "$callee_log"

          "$bin" callee "$callee_requested" ci-pass-02 "$caller_jid" \
            "$callee_out" "$ready" >"$callee_log" 2>&1 &
          callee_pid=$!

          for i in $(seq 1 200); do
            if [[ -s "$ready" ]]; then break; fi
            if ! kill -0 "$callee_pid" 2>/dev/null; then
              cat "$callee_log"
              exit 1
            fi
            sleep 0.1
          done
          test -s "$ready"
          callee_jid="$(tr -d '\r\n' < "$ready")"

          set +e
          "$bin" caller "$caller_jid" ci-pass-01 "$callee_jid" \
            "$caller_out" '' >"$caller_log" 2>&1
          caller_rc=$?
          if [[ "$caller_rc" -ne 0 ]]; then
            kill "$callee_pid" 2>/dev/null || true
          fi
          wait "$callee_pid"
          callee_rc=$?
          set -e

          echo "LIVE_CALL_PROCESS_RC caller=$caller_rc callee=$callee_rc"
          echo "--- caller log ---"
          cat "$caller_log"
          echo "--- callee log ---"
          cat "$callee_log"

          test "$caller_rc" -eq 0
          test "$callee_rc" -eq 0
          grep -Fx "CALL_MEDIA_STARTED=1" "$caller_log"
          grep -Fx "CALL_MEDIA_STARTED=1" "$callee_log"
          grep -F "CALL_NEGOTIATED media=audio local_payloads=" "$caller_log"
          grep -F "CALL_NEGOTIATED media=audio local_payloads=" "$callee_log"
          grep -F "CALL_DECODED_BYTES=" "$caller_log"
          grep -F "CALL_DECODED_BYTES=" "$callee_log"
          grep -Fx "LIVE_CALL_RESULT=success caller completed" "$caller_log"
          grep -Fx "LIVE_CALL_RESULT=success callee completed" "$callee_log"
          grep -Eq 'action="session-initiate"|action=.session-initiate.' "$caller_log"
          grep -Eq 'action="session-accept"|action=.session-accept.' "$callee_log"
          test "$(stat -c %s "$caller_out")" -ge 4096
          test "$(stat -c %s "$callee_out")" -ge 4096
          echo "LIVE_CALL_PCM_BYTES caller=$(stat -c %s "$caller_out") callee=$(stat -c %s "$callee_out")"

      - name: Place bidirectional headless A/V BUNDLE call through Prosody
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          G_DEBUG: fatal-criticals
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/_jingle-call-build/psi_jingle_call_live_client"
          ready="$RUNNER_TEMP/jingle-av-bundle.ready"
          caller_out="$RUNNER_TEMP/jingle-av-bundle-caller.raw"
          callee_out="$RUNNER_TEMP/jingle-av-bundle-callee.raw"
          caller_log="$RUNNER_TEMP/jingle-av-bundle-caller.log"
          callee_log="$RUNNER_TEMP/jingle-av-bundle-callee.log"
          caller_jid="user01@localhost/av-bundle-caller"
          callee_requested="user02@localhost/av-bundle-callee"

          rm -f "$ready" "$caller_out" "$callee_out" "$caller_log" "$callee_log"

          "$bin" callee "$callee_requested" ci-pass-02 "$caller_jid" \
            "$callee_out" "$ready" av-bundle >"$callee_log" 2>&1 &
          callee_pid=$!

          for i in $(seq 1 200); do
            if [[ -s "$ready" ]]; then break; fi
            if ! kill -0 "$callee_pid" 2>/dev/null; then
              cat "$callee_log"
              exit 1
            fi
            sleep 0.1
          done
          test -s "$ready"
          callee_jid="$(tr -d '\r\n' < "$ready")"

          set +e
          "$bin" caller "$caller_jid" ci-pass-01 "$callee_jid" \
            "$caller_out" '' av-bundle >"$caller_log" 2>&1
          caller_rc=$?
          if [[ "$caller_rc" -ne 0 ]]; then
            kill "$callee_pid" 2>/dev/null || true
          fi
          wait "$callee_pid"
          callee_rc=$?
          set -e

          echo "LIVE_AV_BUNDLE_PROCESS_RC caller=$caller_rc callee=$callee_rc"
          echo "--- A/V BUNDLE caller log ---"
          cat "$caller_log"
          echo "--- A/V BUNDLE callee log ---"
          cat "$callee_log"

          test "$caller_rc" -eq 0
          test "$callee_rc" -eq 0
          grep -Fx "CALL_MEDIA_STARTED=1" "$caller_log"
          grep -Fx "CALL_MEDIA_STARTED=1" "$callee_log"
          grep -F "CALL_NEGOTIATED media=audio local_payloads=" "$caller_log"
          grep -F "CALL_NEGOTIATED media=audio local_payloads=" "$callee_log"
          grep -F "CALL_NEGOTIATED media=video local_payloads=" "$caller_log"
          grep -F "CALL_NEGOTIATED media=video local_payloads=" "$callee_log"
          grep -Fx "CALL_VIDEO_DECODED=1" "$caller_log"
          grep -Fx "CALL_VIDEO_DECODED=1" "$callee_log"
          grep -Fx "CALL_MID_NEGOTIATED=1" "$caller_log"
          grep -Fx "CALL_MID_NEGOTIATED=1" "$callee_log"
          grep -Fx "CALL_BUNDLE_NEGOTIATED=1" "$caller_log"
          grep -Fx "CALL_BUNDLE_NEGOTIATED=1" "$callee_log"
          grep -F "urn:ietf:params:rtp-hdrext:sdes:mid" "$caller_log"
          grep -F "urn:ietf:params:rtp-hdrext:sdes:mid" "$callee_log"
          grep -F "semantics=\"BUNDLE\"" "$caller_log"
          grep -F "semantics=\"BUNDLE\"" "$callee_log"
          grep -Fx "LIVE_CALL_RESULT=success caller completed" "$caller_log"
          grep -Fx "LIVE_CALL_RESULT=success callee completed" "$callee_log"
          test "$(stat -c %s "$caller_out")" -ge 4096
          test "$(stat -c %s "$callee_out")" -ge 4096

      - name: Repeat A/V BUNDLE after in-process teardown
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          G_DEBUG: fatal-criticals
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/_jingle-call-build/psi_jingle_call_live_client"
          ready="$RUNNER_TEMP/jingle-av-repeat.ready"
          caller_out="$RUNNER_TEMP/jingle-av-repeat-caller.raw"
          callee_out="$RUNNER_TEMP/jingle-av-repeat-callee.raw"
          caller_log="$RUNNER_TEMP/jingle-av-repeat-caller.log"
          callee_log="$RUNNER_TEMP/jingle-av-repeat-callee.log"
          caller_jid="user01@localhost/av-repeat-caller"
          callee_requested="user02@localhost/av-repeat-callee"

          rm -f "$ready" "$caller_out" "$callee_out" "$caller_log" "$callee_log"

          "$bin" callee "$callee_requested" ci-pass-02 "$caller_jid" \
            "$callee_out" "$ready" av-bundle-repeat >"$callee_log" 2>&1 &
          callee_pid=$!

          for i in $(seq 1 200); do
            if [[ -s "$ready" ]]; then break; fi
            if ! kill -0 "$callee_pid" 2>/dev/null; then
              cat "$callee_log"
              exit 1
            fi
            sleep 0.1
          done
          test -s "$ready"
          callee_jid="$(tr -d '\r\n' < "$ready")"

          set +e
          "$bin" caller "$caller_jid" ci-pass-01 "$callee_jid" \
            "$caller_out" '' av-bundle-repeat >"$caller_log" 2>&1
          caller_rc=$?
          if [[ "$caller_rc" -ne 0 ]]; then
            kill "$callee_pid" 2>/dev/null || true
          fi
          wait "$callee_pid"
          callee_rc=$?
          set -e

          echo "LIVE_AV_REPEAT_PROCESS_RC caller=$caller_rc callee=$callee_rc"
          echo "--- repeated A/V BUNDLE caller log ---"
          cat "$caller_log"
          echo "--- repeated A/V BUNDLE callee log ---"
          cat "$callee_log"

          test "$caller_rc" -eq 0
          test "$callee_rc" -eq 0

          for log in "$caller_log" "$callee_log"; do
            test "$(grep -Fc 'CALL_ITERATION_RESULT=success 1/2' "$log")" -eq 1
            test "$(grep -Fc 'CALL_ITERATION_RESULT=success 2/2' "$log")" -eq 1
            test "$(grep -Fc 'CALL_VIDEO_DECODED=1' "$log")" -ge 2
            test "$(grep -Fc 'CALL_MID_NEGOTIATED=1' "$log")" -ge 2
            test "$(grep -Fc 'CALL_BUNDLE_NEGOTIATED=1' "$log")" -ge 2
            test "$(grep -Fc 'CALL_MEDIA_STARTED=1' "$log")" -ge 2
            ! grep -Fq 'CALL_STALE_TERMINATION_IGNORED=1' "$log"
            ! grep -Fq 'AddressSanitizer' "$log"
          done

          grep -Fq "CALL_RESTART=caller-starting-next" "$caller_log"
          grep -Fq "CALL_RESTART=callee-ready-next" "$callee_log"
          grep -Fx "LIVE_CALL_RESULT=success caller completed" "$caller_log"
          grep -Fx "LIVE_CALL_RESULT=success callee completed" "$callee_log"
          test "$(stat -c %s "$caller_out")" -ge 4096
          test "$(stat -c %s "$callee_out")" -ge 4096

      - name: Show Prosody call log
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/prosody-call.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/prosody-call.pid")" 2>/dev/null || true
          fi
          if [[ -f "$RUNNER_TEMP/prosody-call.log" ]]; then
            tail -n 250 "$RUNNER_TEMP/prosody-call.log"
          fi
