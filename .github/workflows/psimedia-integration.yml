name: PsiMedia integration

on:
  push:
    branches:
      - master
    paths:
      - 'iris'
      - 'src/avcall/**'
      - 'src/psimedia/**'
      - 'plugins/include/psimediaprovider.h'
      - 'tests/avcall/**'
      - 'qa/integration/jingle-live/**'
      - '.github/workflows/psimedia-integration.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'iris'
      - 'src/avcall/**'
      - 'src/psimedia/**'
      - 'plugins/include/psimediaprovider.h'
      - 'tests/avcall/**'
      - 'qa/integration/jingle-live/**'
      - '.github/workflows/psimedia-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  QCA_TAG: v3.0.7

concurrency:
  group: psimedia-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-qt6:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Psi
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize pinned Iris
        shell: bash
        run: git submodule update --init --depth 1 iris

      - name: Checkout matching psimedia SRTP branch
        uses: actions/checkout@v4
        with:
          repository: psi-im/psimedia
          ref: ai/jingle-srtp-psimedia
          path: _psimedia
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ccache \
            g++ \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            libssl-dev \
            libsrtp2-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-tools

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-psimedia-integration-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-psimedia-integration-ccache-

      - name: Install QCA3 release package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf qca-release qca3.zip
          mkdir qca-release
          gh release download "$QCA_TAG" --repo psi-im/qca \
            -p 'qca3-deb-ubuntu-24.04.zip' -O qca3.zip
          (cd qca-release && cmake -E tar xvf ../qca3.zip)
          test -n "$(find qca-release -type f -name '*.deb' -print -quit)"
          sudo apt-get install -y ./qca-release/*.deb

      - name: Record integration versions
        run: |
          echo "Psi: $(git rev-parse HEAD)"
          echo "Iris: $(git -C iris rev-parse HEAD)"
          echo "psimedia: $(git -C _psimedia rev-parse HEAD)"
          echo "QCA: psi-im/qca v3.0.7 release package (qca-ossl)"
          qmake6 -v
          openssl version
          gst-launch-1.0 --version
          pkg-config --modversion gstreamer-1.0 gstreamer-rtp-1.0 libsrtp2

      - name: Configure integration smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _psimedia-smoke
          cat > _psimedia-smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.19)
          project(psimedia_integration_smoke LANGUAGES CXX)

          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_AUTOMOC ON)
          set(QT_DEFAULT_MAJOR_VERSION 6)
          set(BUILD_DEMO OFF CACHE BOOL "" FORCE)
          set(BUILD_PSIPLUGIN ON CACHE BOOL "" FORCE)
          set(PSIMEDIA_BUILD_TESTS ON CACHE BOOL "" FORCE)
          set(USE_PSI ON CACHE BOOL "" FORCE)
          set(MAIN_PROGRAM_NAME psi CACHE STRING "" FORCE)

          if(NOT DEFINED PSI_SOURCE_DIR OR NOT DEFINED PSIMEDIA_SOURCE_DIR)
              message(FATAL_ERROR "PSI_SOURCE_DIR and PSIMEDIA_SOURCE_DIR are required")
          endif()

          find_package(Qt6 REQUIRED COMPONENTS Core Gui Widgets Network Xml Test)

          enable_testing()
          set(PLUGINS_ROOT_DIR "${PSI_SOURCE_DIR}/plugins" CACHE STRING "" FORCE)

          set(IRIS_ENABLE_INSTALL OFF CACHE BOOL "" FORCE)
          set(IRIS_ENABLE_SRTP ON CACHE BOOL "" FORCE)
          set(IRIS_ENABLE_JINGLE_SCTP OFF CACHE BOOL "" FORCE)
          set(IRIS_ENABLE_OMEMO OFF CACHE BOOL "" FORCE)
          set(IRIS_BUNDLED_USRSCTP OFF CACHE BOOL "" FORCE)
          set(IRIS_BUNDLED_QCA OFF CACHE BOOL "" FORCE)
          set(IRIS_SYSTEM_QCA 3 CACHE STRING "" FORCE)
          set(USE_QT6 ON CACHE BOOL "" FORCE)
          add_subdirectory("${PSI_SOURCE_DIR}/iris" iris)

          add_subdirectory("${PSIMEDIA_SOURCE_DIR}" psimedia)

          add_library(psi_native_media_adapter STATIC
              "${PSI_SOURCE_DIR}/src/psimedia/psimedia.cpp"
              "${PSI_SOURCE_DIR}/src/psimedia/psimedia.h"
              "${PSI_SOURCE_DIR}/src/psimedia/psimedia_p.h"
              "${PSI_SOURCE_DIR}/src/avcall/psimediajingle.cpp"
              "${PSI_SOURCE_DIR}/src/avcall/psimediajingle.h"
          )
          target_compile_definitions(psi_native_media_adapter PRIVATE QT_GUI_LIB)
          target_include_directories(psi_native_media_adapter PUBLIC
              "${PSI_SOURCE_DIR}/src"
              "${PSI_SOURCE_DIR}/src/psimedia"
              "${PSI_SOURCE_DIR}/src/avcall"
              "${PSI_SOURCE_DIR}/plugins/include"
          )
          target_link_libraries(psi_native_media_adapter PUBLIC
              Iris::Iris
              Qt6::Core
              Qt6::Gui
              Qt6::Widgets
          )

          add_executable(psimedia_provider_smoke smoke.cpp)
          target_include_directories(psimedia_provider_smoke PRIVATE
              "${PSI_SOURCE_DIR}/plugins/include"
              "${PSIMEDIA_SOURCE_DIR}/gstprovider"
          )
          target_link_libraries(psimedia_provider_smoke PRIVATE gstprovidersrc Qt6::Core)

          add_test(NAME psimedia_provider_smoke COMMAND psimedia_provider_smoke)
          set_tests_properties(psimedia_provider_smoke PROPERTIES TIMEOUT 30)

          add_executable(psimedia_plugin_load_smoke plugin_load_smoke.cpp)
          target_include_directories(psimedia_plugin_load_smoke PRIVATE
              "${PSIMEDIA_SOURCE_DIR}/psimedia"
          )
          target_link_libraries(psimedia_plugin_load_smoke PRIVATE Qt6::Core)
          add_dependencies(psimedia_plugin_load_smoke mediaplugin)
          add_test(NAME psimedia_plugin_load_smoke
              COMMAND psimedia_plugin_load_smoke "$<TARGET_FILE:mediaplugin>")
          set_tests_properties(psimedia_plugin_load_smoke PROPERTIES TIMEOUT 30)

          add_executable(psi_native_media_adapter_smoke native_adapter_smoke.cpp)
          target_include_directories(psi_native_media_adapter_smoke PRIVATE
              "${PSI_SOURCE_DIR}/src/psimedia"
              "${PSI_SOURCE_DIR}/src/avcall"
              "${PSI_SOURCE_DIR}/plugins/include"
              "${PSIMEDIA_SOURCE_DIR}/gstprovider"
          )
          target_link_libraries(psi_native_media_adapter_smoke PRIVATE
              psi_native_media_adapter
              gstprovidersrc
              Iris::Iris
              Qt6::Core
          )
          add_test(NAME psi_native_media_adapter_smoke COMMAND psi_native_media_adapter_smoke)
          set_tests_properties(psi_native_media_adapter_smoke PROPERTIES TIMEOUT 30)

          add_executable(psi_backend_lifecycle_test
              "${PSI_SOURCE_DIR}/tests/avcall/backend-lifecycle/tst_backend_lifecycle.cpp"
          )
          target_include_directories(psi_backend_lifecycle_test PRIVATE
              "${PSI_SOURCE_DIR}/src/psimedia"
              "${PSI_SOURCE_DIR}/src/avcall"
              "${PSI_SOURCE_DIR}/plugins/include"
          )
          target_link_libraries(psi_backend_lifecycle_test PRIVATE
              psi_native_media_adapter
              Iris::Iris
              Qt6::Core
              Qt6::Test
          )
          add_test(NAME psi_backend_lifecycle_test COMMAND psi_backend_lifecycle_test)
          set_tests_properties(psi_backend_lifecycle_test PROPERTIES TIMEOUT 30)

          add_executable(psi_native_media_runtime_error_smoke runtime_error_smoke.cpp)
          target_include_directories(psi_native_media_runtime_error_smoke PRIVATE
              "${PSI_SOURCE_DIR}/src"
              "${PSI_SOURCE_DIR}/src/psimedia"
              "${PSI_SOURCE_DIR}/src/avcall"
              "${PSI_SOURCE_DIR}/plugins/include"
              "${PSIMEDIA_SOURCE_DIR}/gstprovider"
          )
          target_link_libraries(psi_native_media_runtime_error_smoke PRIVATE
              psi_native_media_adapter
              gstprovidersrc
              Iris::Iris
              Qt6::Core
              Qt6::Network
          )
          add_test(NAME psi_native_media_runtime_error_smoke COMMAND psi_native_media_runtime_error_smoke)
          set_tests_properties(psi_native_media_runtime_error_smoke PROPERTIES TIMEOUT 30)

          add_executable(psi_native_media_peer_smoke native_media_peer_smoke.cpp)
          target_include_directories(psi_native_media_peer_smoke PRIVATE
              "${PSI_SOURCE_DIR}/src/psimedia"
              "${PSI_SOURCE_DIR}/src/avcall"
              "${PSI_SOURCE_DIR}/plugins/include"
              "${PSIMEDIA_SOURCE_DIR}/gstprovider"
          )
          target_link_libraries(psi_native_media_peer_smoke PRIVATE
              psi_native_media_adapter
              gstprovidersrc
              Iris::Iris
              Qt6::Core
              Qt6::Network
          )
          add_test(NAME psi_native_media_peer_smoke COMMAND psi_native_media_peer_smoke)
          set_tests_properties(psi_native_media_peer_smoke PROPERTIES TIMEOUT 35)
          EOF

          cat > _psimedia-smoke/smoke.cpp <<'EOF'
          #include "gstprovider.h"
          #include "psimediaprovider.h"

          #include <QCoreApplication>
          #include <QDebug>

          static_assert(sizeof(PsiMedia::PRtpPacket::Type) == sizeof(int));
          static_assert(static_cast<int>(PsiMedia::PRtpPacket::Type::Rtp) == 0);
          static_assert(static_cast<int>(PsiMedia::PRtpPacket::Type::Rtcp) == 1);

          int main(int argc, char **argv)
          {
              QCoreApplication app(argc, argv);

              PsiMedia::GstProvider provider;
              if (!provider.isInitialized()) {
                  qCritical() << "GstProvider failed to initialize";
                  return 1;
              }

              auto *session = provider.createRtpSession();
              if (!session) {
                  qCritical() << "GstProvider returned a null RTP session";
                  return 2;
              }
              if (!session->qobject()) {
                  qCritical() << "GstProvider RTP session has no QObject facade";
                  delete session;
                  return 3;
              }
              if (qobject_cast<PsiMedia::SecureRtpSessionContext *>(session->qobject())) {
                  qCritical() << "Legacy RTP session falsely advertises the secure RTP IID";
                  delete session;
                  return 4;
              }
              delete session;

              auto *secureProvider = qobject_cast<PsiMedia::SecureRtpProvider *>(provider.qobject());
              if (!secureProvider || secureProvider->supportedSecureRtpProfiles().isEmpty()) {
                  qCritical() << "GstProvider did not expose usable secure RTP capability";
                  return 5;
              }

              auto *secureSession = secureProvider->createSecureRtpSession();
              if (!secureSession || !secureSession->qobject()
                  || !qobject_cast<PsiMedia::SecureRtpSessionContext *>(secureSession->qobject())
                  || !qobject_cast<PsiMedia::RtpSessionContext *>(secureSession->qobject())) {
                  qCritical() << "Secure RTP factory did not return a dual-interface media session";
                  delete secureSession;
                  return 6;
              }

              // Session ownership is caller-side and must end before provider/plugin unload.
              secureSession->setProtectedPacketHandler({});
              secureSession->setRuntimeErrorHandler({});
              delete secureSession;

              qInfo() << "Real psimedia provider and secure RTP ABI smoke passed";
              return 0;
          }
          EOF

          cat > _psimedia-smoke/plugin_load_smoke.cpp <<'EOF'
          #include "psimediaprovider.h"

          #include <QCoreApplication>
          #include <QDebug>
          #include <QFileInfo>
          #include <QJsonObject>
          #include <QPluginLoader>

          int main(int argc, char **argv)
          {
              QCoreApplication app(argc, argv);
              if (argc != 2) {
                  qCritical() << "Expected production psimedia plugin path";
                  return 1;
              }

              const QString pluginPath = QFileInfo(QString::fromLocal8Bit(argv[1])).absoluteFilePath();
              QPluginLoader loader(pluginPath);
              const auto metadata = loader.metaData();
              const QString iid = metadata.value(QStringLiteral("IID")).toString();
              if (iid != QLatin1String("org.psi-im.PsiMediaPlugin")) {
                  qCritical() << "Unexpected psimedia plugin IID" << iid << pluginPath;
                  return 2;
              }

              QObject *instance = loader.instance();
              if (!instance) {
                  qCritical() << "Could not load production psimedia plugin" << pluginPath << loader.errorString();
                  return 3;
              }

              auto *plugin = qobject_cast<PsiMedia::Plugin *>(instance);
              if (!plugin) {
                  qCritical() << "Loaded psimedia binary does not expose PsiMedia::Plugin"
                              << instance->metaObject()->className() << pluginPath;
                  return 4;
              }
              if (QString::fromLatin1(instance->metaObject()->className()) != QLatin1String("PsiMediaPlugin")) {
                  qCritical() << "Unexpected production psimedia plugin class"
                              << instance->metaObject()->className() << pluginPath;
                  return 5;
              }

              qInfo() << "Production psimedia plugin loaded through PsiMedia::Plugin"
                      << pluginPath << iid << instance->metaObject()->className();
              return 0;
          }
          EOF

          cat > _psimedia-smoke/native_adapter_smoke.cpp <<'EOF'
          #include "gstprovider.h"
          #include "psimedia.h"
          #include "psimediajingle.h"

          #include <iris/jingle-rtp.h>

          #include <QCoreApplication>
          #include <QDebug>
          #include <QElapsedTimer>
          #include <QEventLoop>
          #include <QThread>

          #include <algorithm>
          #include <optional>
          #include <utility>
          #include <vector>

          namespace RTP = XMPP::Jingle::RTP;

          template<typename Predicate> bool waitUntil(Predicate predicate, int timeoutMs)
          {
              QElapsedTimer timer;
              timer.start();
              while (timer.elapsed() < timeoutMs) {
                  QCoreApplication::processEvents(QEventLoop::AllEvents, 20);
                  if (predicate())
                      return true;
                  QThread::msleep(5);
              }
              QCoreApplication::processEvents(QEventLoop::AllEvents);
              return predicate();
          }

          QByteArray makeOpusRtp(quint16 sequence, quint32 timestamp, quint32 ssrc, quint8 payloadType)
          {
              QByteArray packet(15, char(0));
              auto *p = reinterpret_cast<uchar *>(packet.data());
              p[0]  = 0x80;
              p[1]  = payloadType & 0x7f;
              p[2]  = uchar(sequence >> 8);
              p[3]  = uchar(sequence);
              p[4]  = uchar(timestamp >> 24);
              p[5]  = uchar(timestamp >> 16);
              p[6]  = uchar(timestamp >> 8);
              p[7]  = uchar(timestamp);
              p[8]  = uchar(ssrc >> 24);
              p[9]  = uchar(ssrc >> 16);
              p[10] = uchar(ssrc >> 8);
              p[11] = uchar(ssrc);
              // Valid Opus comfort/silence frame used only to exercise the
              // receive pipeline without any physical playback device.
              p[12] = 0xf8;
              p[13] = 0xff;
              p[14] = 0xfe;
              return packet;
          }

          bool containsReceiverReport(const QByteArray &compound)
          {
              const auto *bytes = reinterpret_cast<const uchar *>(compound.constData());
              int offset = 0;
              while (offset + 4 <= compound.size()) {
                  const auto *packet = bytes + offset;
                  if ((packet[0] >> 6) != 2)
                      return false;
                  const int packetBytes = (int(packet[2]) * 256 + int(packet[3]) + 1) * 4;
                  if (packetBytes < 4 || offset + packetBytes > compound.size())
                      return false;
                  if (packet[1] == 201)
                      return true;
                  offset += packetBytes;
              }
              return false;
          }

          int main(int argc, char **argv)
          {
              QCoreApplication app(argc, argv);

              PsiMedia::GstProvider gstProvider;
              if (!gstProvider.isInitialized()) {
                  qCritical() << "GstProvider failed to initialize";
                  return 1;
              }
              PsiMedia::setProvider(&gstProvider);

              PsiMediaJingleCapabilities capabilities;
              capabilities.backendAvailable = true;
              capabilities.probeComplete    = true;
              capabilities.secureRtp        = true;
              capabilities.audio            = true;
              capabilities.video            = true;

              auto provider = makePsiMediaJingleProvider(capabilities);
              if (!provider
                  || provider->mediaTypes()
                      != QStringList { QStringLiteral("audio"), QStringLiteral("video") }) {
                  qCritical() << "Psi native media provider did not expose audio+video";
                  return 2;
              }

              auto session = provider->createSession();
              auto audioEndpoint = session
                  ? session->createEndpoint(QStringLiteral("audio"), QStringLiteral("audio"))
                  : nullptr;
              auto videoEndpoint = session
                  ? session->createEndpoint(QStringLiteral("video"), QStringLiteral("video"))
                  : nullptr;
              if (!session || !audioEndpoint || !videoEndpoint) {
                  qCritical() << "Psi native media adapter did not create audio+video endpoints";
                  return 3;
              }

              bool runtimeFailed = false;
              RTP::MediaError runtimeError;
              QObject::connect(session.get(), &RTP::MediaSession::runtimeError,
                               [&](const RTP::MediaError &error) {
                                   runtimeFailed = true;
                                   runtimeError  = error;
                               });

              bool audioPrepared = false;
              bool videoPrepared = false;
              RTP::MediaError audioPrepareError;
              RTP::MediaError videoPrepareError;
              std::optional<RTP::Description> audioLocal;
              std::optional<RTP::Description> videoLocal;
              auto audioPrepare = session->prepareLocalOffer(
                  audioEndpoint.get(),
                  [&](RTP::MediaOperation::Id, std::optional<RTP::Description> description, RTP::MediaError error) {
                      audioLocal        = std::move(description);
                      audioPrepareError = std::move(error);
                      audioPrepared     = true;
                  });
              auto videoPrepare = session->prepareLocalOffer(
                  videoEndpoint.get(),
                  [&](RTP::MediaOperation::Id, std::optional<RTP::Description> description, RTP::MediaError error) {
                      videoLocal        = std::move(description);
                      videoPrepareError = std::move(error);
                      videoPrepared     = true;
                  });
              if (!audioPrepare || !videoPrepare
                  || !waitUntil([&] { return (audioPrepared && videoPrepared) || runtimeFailed; }, 10000)
                  || runtimeFailed || audioPrepareError || videoPrepareError || !audioLocal || !videoLocal
                  || audioLocal->media != QLatin1String("audio") || videoLocal->media != QLatin1String("video")
                  || !audioLocal->rtcpMux || !videoLocal->rtcpMux
                  || audioLocal->payloads.isEmpty() || videoLocal->payloads.isEmpty()) {
                  qCritical() << "Device-free real-backend audio+video RTP prepare failed"
                              << int(audioPrepareError.code) << audioPrepareError.text
                              << int(videoPrepareError.code) << videoPrepareError.text
                              << int(runtimeError.code) << runtimeError.text;
                  return 4;
              }
              audioPrepare.reset();
              videoPrepare.reset();

              const auto opus = std::find_if(
                  audioLocal->payloads.cbegin(), audioLocal->payloads.cend(), [](const auto &payload) {
                      return payload.name.compare(QLatin1String("opus"), Qt::CaseInsensitive) == 0
                          && payload.clockrate && *payload.clockrate == 48000;
                  });
              if (opus == audioLocal->payloads.cend()) {
                  qCritical() << "Real backend did not negotiate Opus";
                  return 5;
              }
              const auto vp8 = std::find_if(
                  videoLocal->payloads.cbegin(), videoLocal->payloads.cend(), [](const auto &payload) {
                      return payload.name.compare(QLatin1String("VP8"), Qt::CaseInsensitive) == 0
                          && payload.clockrate && *payload.clockrate == 90000;
                  });
              if (vp8 == videoLocal->payloads.cend()) {
                  qCritical() << "Real backend did not negotiate VP8";
                  return 6;
              }

              bool audioApplied = false;
              bool videoApplied = false;
              RTP::MediaError audioApplyError;
              RTP::MediaError videoApplyError;
              auto audioApply = session->applyNegotiation(
                  audioEndpoint.get(), *audioLocal, *audioLocal,
                  [&](RTP::MediaOperation::Id, RTP::MediaError error) {
                      audioApplyError = std::move(error);
                      audioApplied    = true;
                  });
              auto videoApply = session->applyNegotiation(
                  videoEndpoint.get(), *videoLocal, *videoLocal,
                  [&](RTP::MediaOperation::Id, RTP::MediaError error) {
                      videoApplyError = std::move(error);
                      videoApplied    = true;
                  });
              if (!audioApply || !videoApply
                  || !waitUntil([&] { return (audioApplied && videoApplied) || runtimeFailed; }, 10000)
                  || runtimeFailed || audioApplyError || videoApplyError) {
                  qCritical() << "Real-backend audio+video RTP apply failed"
                              << int(audioApplyError.code) << audioApplyError.text
                              << int(videoApplyError.code) << videoApplyError.text
                              << int(runtimeError.code) << runtimeError.text;
                  return 7;
              }
              audioApply.reset();
              videoApply.reset();

              std::vector<QByteArray> rtcpPackets;
              if (!audioEndpoint->attachPacketIo([&](QByteArray packet, RTP::SrtpContext::Packet kind) {
                      if (kind == RTP::SrtpContext::Packet::Rtcp)
                          rtcpPackets.push_back(std::move(packet));
                      return true;
                  })) {
                  qCritical() << "Production Psi audio endpoint refused packet I/O";
                  return 8;
              }
              if (!videoEndpoint->attachPacketIo([](QByteArray, RTP::SrtpContext::Packet) { return true; })) {
                  qCritical() << "Production Psi video endpoint refused packet I/O";
                  return 9;
              }

              constexpr quint32 RemoteSsrc = 0x44556677;
              for (quint16 sequence = 1; sequence <= 4; ++sequence) {
                  audioEndpoint->receivePacket(
                      makeOpusRtp(sequence, 48000u + quint32(sequence - 1) * 960u, RemoteSsrc, opus->id),
                      RTP::SrtpContext::Packet::Rtp);
              }

              if (!waitUntil([&] {
                      if (runtimeFailed)
                          return true;
                      for (const auto &packet : rtcpPackets) {
                          if (containsReceiverReport(packet))
                              return true;
                      }
                      return false;
                  }, 12000)
                  || runtimeFailed) {
                  qCritical() << "Production Psi adapter did not return an RTCP receiver report"
                              << int(runtimeError.code) << runtimeError.text;
                  return 10;
              }

              audioEndpoint->stop();
              videoEndpoint->stop();
              audioEndpoint.reset();
              videoEndpoint.reset();
              session.reset();

              qInfo() << "Psi native media adapter real-backend audio/video negotiation + RTP/RTCP smoke passed";
              return 0;
          }
          EOF

          cat > _psimedia-smoke/runtime_error_smoke.cpp <<'EOF'
          #include "gstprovider.h"
          #include "psimedia.h"
          #include "psimediajingle.h"

          #include <iris/jingle-rtp.h>
          #include <iris/jingle-session.h>
          #include <iris/xmpp_client.h>

          #include <QCoreApplication>
          #include <QDebug>
          #include <QElapsedTimer>
          #include <QEventLoop>

          #include <optional>

          using namespace XMPP;
          namespace J = XMPP::Jingle;
          namespace RTP = XMPP::Jingle::RTP;

          static void check(bool ok, const char *message)
          {
              if (!ok)
                  qFatal("%s", message);
          }

          template<typename Predicate> bool waitUntil(Predicate predicate, int timeoutMs)
          {
              QElapsedTimer timer;
              timer.start();
              while (timer.elapsed() < timeoutMs) {
                  QCoreApplication::processEvents(QEventLoop::AllEvents, 20);
                  if (predicate())
                      return true;
              }
              QCoreApplication::processEvents(QEventLoop::AllEvents);
              return predicate();
          }

          int main(int argc, char **argv)
          {
              QCoreApplication app(argc, argv);

              PsiMedia::GstProvider gstProvider;
              check(gstProvider.isInitialized(), "GstProvider failed to initialize");
              PsiMedia::setProvider(&gstProvider);

              PsiMediaJingleCapabilities capabilities;
              capabilities.backendAvailable = true;
              capabilities.probeComplete    = true;
              capabilities.secureRtp        = true;
              capabilities.audio            = true;
              auto provider = makePsiMediaJingleProvider(capabilities);
              check(provider && provider->mediaTypes() == QStringList { QStringLiteral("audio") },
                    "real Psi media provider did not expose audio");

              Client client;
              J::Session jingleSession(client.jingleManager(), Jid("peer@example.test/device"),
                                       J::Origin::Initiator);
              auto *rtpManager = client.jingleManager()->rtpManager();
              rtpManager->setMediaProvider(provider);

              auto basePad = jingleSession.applicationPadFactory(RTP::Description::ns());
              auto pad = qSharedPointerDynamicCast<RTP::Pad>(basePad);
              check(bool(pad) && pad->mediaSession(), "registered real RTP media session unavailable");
