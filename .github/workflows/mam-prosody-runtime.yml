name: MAM Prosody runtime

on:
  push:
    paths:
      - 'qa/integration/mam-live/**'
      - 'src/**'
      - 'tests/mam*/**'
      - 'iris'
      - '.github/workflows/mam-prosody-runtime.yml'
  pull_request:
    paths:
      - 'qa/integration/mam-live/**'
      - 'src/**'
      - 'tests/mam*/**'
      - 'iris'
      - '.github/workflows/mam-prosody-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only the newest commit of a PR needs expensive build/test runners.
  # Keep manual dispatches independent and keep master distinct from PRs.
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  mam-prosody-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize pinned Iris
        run: |
          git submodule update --init iris
          git -C iris submodule update --init --depth 1
      - name: Install Qt5, QCA and Prosody
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config \
            qtbase5-dev libqca-qt5-2-dev libssl-dev zlib1g-dev prosody
          sudo systemctl stop prosody.service 2>/dev/null || true
          sudo service prosody stop 2>/dev/null || true
      - name: Build network-level Iris MAM smoke client
        run: |
          cmake -S qa/integration/mam-live -B build-mam-live -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPSI_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build build-mam-live --target psi_mam_prosody_client --parallel 4
      - name: Start temporary Prosody with mod_mam
        shell: bash
        run: |
          set -euo pipefail
          export PROSODY_DATA_DIR="$RUNNER_TEMP/psi-mam-prosody-data"
          export PROSODY_PID_FILE="$RUNNER_TEMP/psi-mam-prosody.pid"
          mkdir -p "$PROSODY_DATA_DIR"
          cfg="$GITHUB_WORKSPACE/qa/integration/mam-live/prosody.cfg.lua"
          mkdir -p "$GITHUB_WORKSPACE/qa/integration/mam-live/certs"
          prosodyctl --config "$cfg" check config
          prosodyctl --config "$cfg" register user01 localhost ci-pass-01
          prosodyctl --config "$cfg" register user02 localhost ci-pass-02
          prosody -F --config "$cfg" >"$RUNNER_TEMP/psi-mam-prosody.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/psi-mam-prosody-process.pid"
          for i in $(seq 1 100); do
            if (echo > /dev/tcp/127.0.0.1/5222) 2>/dev/null; then exit 0; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/psi-mam-prosody-process.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/psi-mam-prosody.log"
              exit 1
            fi
            sleep 0.1
          done
          cat "$RUNNER_TEMP/psi-mam-prosody.log"
          exit 1
      - name: Verify live MAM archive and three-page backward scrollback
        run: |
          set -euo pipefail
          timeout 80s ./build-mam-live/psi_mam_prosody_client 2>&1 | tee "$RUNNER_TEMP/psi-mam-runtime.log"
          grep -F 'MAM_RUNTIME_RESULT=success' "$RUNNER_TEMP/psi-mam-runtime.log"
      - name: Collect Prosody runtime diagnostics
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/psi-mam-prosody-process.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/psi-mam-prosody-process.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/psi-mam-prosody.log" ]; then
            tail -n 250 "$RUNNER_TEMP/psi-mam-prosody.log"
          fi

  native-muc-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        qt: [5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: mam-native-qt${{ matrix.qt }}
      - name: Install native client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config python3 \
            libssl-dev zlib1g-dev libhttp-parser-dev libminizip-dev libtidy-dev \
            libsm-dev libxss-dev
          if [ '${{ matrix.qt }}' = 5 ]; then
            sudo apt-get install -y qtbase5-dev qtmultimedia5-dev libqt5svg5-dev \
              libqt5x11extras5-dev libqca-qt5-2-dev libqt5sql5-sqlite
          else
            sudo apt-get install -y qt6-base-dev qt6-multimedia-dev qt6-svg-dev \
              libqca-qt6-dev libqt6sql6-sqlite
          fi
      - name: Build actual Psi BASIC client
        run: |
          cmake -S . -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUSE_QT6=${{ matrix.qt == 6 && 'ON' || 'OFF' }} -DCHAT_TYPE=BASIC \
            -DBUNDLED_IRIS=ON -DIRIS_SYSTEM_QCA=2 -DENABLE_OMEMO=OFF \
            -DENABLE_AVCALL=OFF -DIRIS_ENABLE_JINGLE_SCTP=OFF \
            -DUSE_KEYCHAIN=OFF -DUSE_HUNSPELL=OFF -DENABLE_PLUGINS=OFF \
            -DPSI_DATADIR="$GITHUB_WORKSPACE" -DBUILD_TESTING=ON
          cmake --build build-native --target psi --parallel 4
      - name: Build native geometry probe
        run: |
          cmake -S qa/integration/mam-live/probe -B build-native-probe -G Ninja \
            -DQT_DEFAULT_MAJOR_VERSION=${{ matrix.qt }}
          cmake --build build-native-probe --parallel 4
      - name: Start isolated MUC archive
        run: |
          docker run -d --name mam-native -p 127.0.0.1:55323:5222 \
            -v "$GITHUB_WORKSPACE/qa/integration/mam-live/muc-prosody.cfg.lua:/etc/prosody/prosody.cfg.lua:ro" \
            prosodyim/prosody:13.0
          docker exec mam-native prosodyctl register user01 localhost ci-pass-01
      - name: Verify first MUC window, sparse protocol events and EDB reopen
        run: |
          python3 qa/integration/mam-live/muc_runtime.py \
            --psi build-native/psi/psi --output "$RUNNER_TEMP/mam-native-runtime" \
            --probe build-native-probe --check-metadata-upgrade
          python3 qa/integration/mam-live/muc_runtime.py \
            --psi build-native/psi/psi --output "$RUNNER_TEMP/mam-native-fallback" \
            --probe build-native-probe --mode fallback --bodies 1200
      - name: Verify index seek with real MAM storage and test-only index adapter
        run: |
          docker stop mam-native
          docker run -d --name mam-native-indexed -p 127.0.0.1:55324:5222 \
            -e MAM_TEST_INDEX=1 \
            -v "$GITHUB_WORKSPACE/qa/integration/mam-live/muc-prosody.cfg.lua:/etc/prosody/prosody.cfg.lua:ro" \
            -v "$GITHUB_WORKSPACE/qa/integration/mam-live/modules/mod_mam_test_index.lua:/usr/lib/prosody/modules/mod_mam_test_index.lua:ro" \
            prosodyim/prosody:13.0
          docker exec mam-native-indexed prosodyctl register user01 localhost ci-pass-01
          python3 qa/integration/mam-live/muc_runtime.py \
            --psi build-native/psi/psi --port 55324 --output "$RUNNER_TEMP/mam-native-indexed" \
            --probe build-native-probe --mode indexed --bodies 1200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mam-native-qt${{ matrix.qt }}-logs
          path: ${{ runner.temp }}/mam-native-*/*.log
      - name: Collect server log
        if: always()
        run: |
          docker logs mam-native || true
          docker logs mam-native-indexed || true
          docker rm -f mam-native mam-native-indexed || true
