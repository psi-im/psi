name: Fedora latest Qt6 WebEngine CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fedora-qt6-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Fedora latest / Qt6 / GCC / WEBENGINE
    runs-on: ubuntu-24.04
    container: fedora:latest
    timeout-minutes: 85
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Install development dependencies
        run: |
          dnf install -y git-core gcc gcc-c++ cmake ninja-build ccache \
            pkgconf-pkg-config openssl-devel zlib-devel \
            qt6-qtbase-devel qt6-qtmultimedia-devel qt6-qtsvg-devel \
            qt6-qttools-devel qt6-qtwebengine-devel \
            glib2-devel gstreamer1-devel hunspell-devel \
            libXScrnSaver-devel libgcrypt-devel libidn-devel \
            libomemo-c-devel libotr-devel libsrtp-devel libtidy-devel \
            protobuf-c-devel usrsctp-devel
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Mark checkout safe and initialize pinned sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 \
            3rdparty/http-parser 3rdparty/qhttp 3rdparty/qite 3rdparty/qsourcehighlite
          git submodule update --init --depth 1 iris
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: psi-fedora-qt6-webengine-gcc-${{ github.sha }}
          restore-keys: |
            psi-fedora-qt6-webengine-gcc-
      - name: Resolve locked QCA source
        uses: ./.github/actions/load-dependencies
        with:
          require-iris: 'true'
      - name: Build shared QCA3 against Fedora Qt6
        run: |
          ccache --max-size=1G
          ccache --zero-stats
          git clone --depth 1 --branch "$QCA_TAG" https://github.com/psi-im/qca.git _qca
          test "$(git -C _qca rev-parse HEAD)" = "$QCA_COMMIT"
          cmake -S _qca -B _qca-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_QT6=ON \
            -DBUILD_TESTS=OFF -DBUILD_TOOLS=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/_qca-sdk" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build _qca-build --parallel 4
          cmake --install _qca-build
      - name: Select Iris release SDK or pinned submodule
        env:
          IRIS_INSTALL_PREFIX: ${{ runner.temp }}/iris-sdk
          IRIS_C_COMPILER: gcc
          IRIS_CXX_COMPILER: g++
          IRIS_QT_MAJOR: '6'
        run: bash .github/scripts/select-linux-iris.sh
      - name: Configure and build Psi
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/_qca-sdk;$IRIS_PREFIX" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DUSE_QT6=ON -DQT_DEFAULT_MAJOR_VERSION=6 \
            -DBUNDLED_IRIS="$IRIS_BUNDLED" \
            -DIRIS_BUNDLED_QCA=OFF -DIRIS_SYSTEM_QCA=3 \
            -DIRIS_BUNDLED_USRSCTP=OFF -DIRIS_BUNDLED_OMEMO_C=OFF \
            -DCHAT_TYPE=WEBENGINE \
            -DENABLE_PLUGINS=OFF -DBUILD_PSIMEDIA=OFF \
            -DUSE_KEYCHAIN=OFF -DUSE_HUNSPELL=ON \
            -DBUILD_TESTING=ON
          cmake --build build --parallel 4
      - name: Cache statistics
        run: ccache --show-stats
