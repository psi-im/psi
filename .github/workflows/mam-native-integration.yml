name: MAM native chat integration (development Iris)

on:
  push:
    paths:
      - 'src/chatdlg.*'
      - 'src/psichatdlg.*'
      - 'src/widgets/LongListWidget.*'
      - 'src/widgets/MamChatWidget.*'
      - 'src/widgets/OverlayScrollBarManager.*'
      - 'src/src.cmake'
      - '.github/workflows/mam-native-integration.yml'
  pull_request:
    paths:
      - 'src/chatdlg.*'
      - 'src/psichatdlg.*'
      - 'src/widgets/LongListWidget.*'
      - 'src/widgets/MamChatWidget.*'
      - 'src/widgets/OverlayScrollBarManager.*'
      - 'src/src.cmake'
      - '.github/workflows/mam-native-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basic-qt5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Resolve non-Iris submodules
        run: |
          git submodule update --init --depth 1 3rdparty/http-parser 3rdparty/qhttp 3rdparty/qite
      - name: Use reviewed Iris MAM implementation for development
        run: |
          git submodule update --init iris
          git -C iris fetch --depth=1 origin 292b150f8e97fa480a0def4ae6cd25abc21a1529
          git -C iris checkout --detach 292b150f8e97fa480a0def4ae6cd25abc21a1529
          git -C iris submodule update --init --depth 1
          git -C iris rev-parse HEAD
      - name: Install Qt5 and Psi dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config zlib1g-dev \
            qtbase5-dev libqt5svg5-dev libqt5x11extras5-dev qtmultimedia5-dev \
            libqca-qt5-2-dev libotr5-dev libhttp-parser-dev \
            libminizip-dev libsm-dev libssl-dev libusrsctp-dev \
            libsrtp2-dev libtidy-dev libxss-dev
      - name: Configure basic chat with bundled development Iris
        run: |
          cmake -S . -B build-mam-chat -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCHAT_TYPE=BASIC \
            -DBUNDLED_IRIS=ON -DBUNDLED_IRIS_ALL=OFF \
            -DIRIS_SYSTEM_QCA=2 -DIRIS_ENABLE_OMEMO=OFF \
            -DENABLE_OMEMO=OFF -DENABLE_PLUGINS=OFF \
            -DUSE_KEYCHAIN=OFF -DUSE_HUNSPELL=OFF -DUSE_SPARKLE=OFF \
            -DBUILD_TESTING=OFF
      - name: Build Psi basic with MAM widget timeline
        run: cmake --build build-mam-chat --parallel 4
