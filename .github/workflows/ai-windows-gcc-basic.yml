name: AI Windows GCC BASIC CI

# Optional Qt5/MinGW compatibility smoke check, not part of ordinary CI.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-windows-gcc-basic-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  resolve-dependencies:
    runs-on: ubuntu-24.04
    outputs:
      sdk_tag: ${{ steps.deps.outputs.msys2_sdk_tag }}
      sdk_archive: ${{ steps.deps.outputs.msys2_sdk_archive }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/load-dependencies
        id: deps

  windows-gcc-basic:
    needs: resolve-dependencies
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref_name, 'ai/') ||
      startsWith(github.head_ref, 'ai/')
    uses: ./.github/workflows/windows-msys2-qt5-profile.yml
    with:
      profile: modern
      chat_type: BASIC
      run_tests: true
      package: false
      allow_failure: false
      sdk_tag: ${{ needs.resolve-dependencies.outputs.sdk_tag }}
      sdk_archive: ${{ needs.resolve-dependencies.outputs.sdk_archive }}
