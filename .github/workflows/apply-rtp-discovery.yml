name: Apply RTP discovery patch

on:
  push:
    branches:
      - ai/jingle-native-calls

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Stage RTP discovery patch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false
          ref: ai/jingle-native-calls
      - run: python3 .github/rtp-discovery-patch.py
      - run: |
          git update-index --cacheinfo 160000,ef1f44ce7faa75570131e142648889455a9eb7a6,iris
          git rm .github/workflows/apply-rtp-discovery.yml .github/rtp-discovery-patch.py
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add src/avcall/psimediajingle.cpp
          git commit -m 'Advertise psimedia RTP call capabilities'
          git push origin HEAD:ai/jingle-native-calls
