name: One-shot single Jingle manager migration

on:
  push:
    branches:
      - 'ai/jingle-native-calls'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot native Jingle migration patch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false
          ref: ai/jingle-native-calls

      - name: Remove legacy external-manager call and update Iris
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/psiaccount.cpp')
          text = path.read_text()
          old = '    d->client->jingleManager()->addExternalManager("urn:xmpp:jingle:apps:rtp:1");\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy external-manager call, got {text.count(old)}')
          path.write_text(text.replace(old, ''))
          PY
          git update-index --cacheinfo 160000,5b8bde6bbd829d4dd39d5ec71dab9c465af6b4ef,iris
          git rm .github/workflows/ai-once-single-jingle.yml

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add src/psiaccount.cpp
          git commit -m 'Use the single Iris Jingle manager'
          git push origin HEAD:ai/jingle-native-calls
