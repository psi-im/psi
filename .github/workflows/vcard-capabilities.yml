name: vCard capability routing

on:
  push:
    paths:
      - 'src/vcardfactory.cpp'
      - 'src/vcardrequestpolicy.h'
      - 'tests/account/vcardrequestpolicytest.cpp'
      - 'tests/account/CMakeLists.txt'
      - '.github/workflows/vcard-capabilities.yml'
  pull_request:
    paths:
      - 'src/vcardfactory.cpp'
      - 'src/vcardrequestpolicy.h'
      - 'tests/account/vcardrequestpolicytest.cpp'
      - 'tests/account/CMakeLists.txt'
      - '.github/workflows/vcard-capabilities.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        qt: [5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: |
          sudo apt-get update
          if [[ "${{ matrix.qt }}" == "6" ]]; then
            sudo apt-get install -y cmake ninja-build qt6-base-dev
          else
            sudo apt-get install -y cmake ninja-build qtbase5-dev
          fi
      - name: Configure
        run: cmake -S tests/account -B build-vcard -G Ninja -DQT_DEFAULT_MAJOR_VERSION=${{ matrix.qt }}
      - name: Build and run vCard routing regression
        run: |
          cmake --build build-vcard --target account_vcard_request_policy_test --parallel 2
          ctest --test-dir build-vcard -R '^account_vcard_request_policy$' --output-on-failure
