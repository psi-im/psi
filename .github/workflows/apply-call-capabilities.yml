name: Apply native call capability patch

on:
  push:
    branches:
      - ai/jingle-native-calls

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    if: contains(github.event.head_commit.message, 'Stage native call capability patch')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ai/jingle-native-calls
      - run: python3 .github/call-capabilities-patch.py
      - run: |
          git rm .github/workflows/apply-call-capabilities.yml .github/call-capabilities-patch.py
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add CMakeLists.txt src/avcall src/psiaccount.cpp tests/avcall/backend-lifecycle \
            .github/workflows/ubuntu.yml .github/workflows/fedora.yml \
            .github/workflows/windows-msvc-qt6.yml .github/workflows/windows-msvc-qt6-profile.yml \
            .github/workflows/windows-sdk-msvc-qt6.yml .github/workflows/windows-msys2-qt5-profile.yml
          git commit -m 'Gate native calls on runtime media capabilities'
          git push origin HEAD:ai/jingle-native-calls
