name: Windows MSVC Qt6 profile

on:
  workflow_call:
    inputs:
      sdk_tag:
        description: Dependency SDK release tag
        required: false
        default: ''
        type: string
      sdk_archive:
        description: Dependency SDK release asset
        required: false
        default: ''
        type: string

permissions:
  contents: read


jobs:
  build:
    name: modern MSVC Qt6 x64
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Fetch Psi history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          submodules: false

      - name: Fetch bundled sources shallowly
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1
          bash .github/scripts/ensure-iris-version-history.sh

      - name: Resolve dependency SDK from Psi lock
        id: deps
        uses: ./.github/actions/load-dependencies

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: windows-msvc-qt6-ccache-${{ github.sha }}
          restore-keys: |
            windows-msvc-qt6-ccache-

      - name: Install Qt 6.12 + WebEngine
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.deps.outputs.qt6_version }}
          arch: win64_msvc2022_64
          # Pin the merged aqtinstall#1000 Qt 6.11+ Windows repository fix.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          modules: qtmultimedia qtwebchannel qtpositioning qtwebengine qtimageformats
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify Windows 10 compile baseline
        run: |
          @'
          #include <windows.h>
          #if _WIN32_WINNT != 0x0A00
          #error _WIN32_WINNT baseline mismatch
          #endif
          #if WINVER != 0x0A00
          #error WINVER baseline mismatch
          #endif
          int main() { return 0; }
          '@ | Set-Content winver-check.cpp -Encoding ascii

          cl.exe /nologo /c /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 winver-check.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install packaging tools
        run: |
          choco install ccache ninja nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download dependency SDK
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ steps.deps.outputs.msvc_sdk_tag }}
          SDK_ARCHIVE: ${{ steps.deps.outputs.msvc_sdk_archive }}
          REQUESTED_SDK_TAG: ${{ inputs.sdk_tag }}
          REQUESTED_SDK_ARCHIVE: ${{ inputs.sdk_archive }}
        run: |
          if ($env:REQUESTED_SDK_TAG -and $env:REQUESTED_SDK_TAG -ne $env:SDK_TAG) {
            throw 'SDK tag disagrees with dependencies.lock.json'
          }
          if ($env:REQUESTED_SDK_ARCHIVE -and $env:REQUESTED_SDK_ARCHIVE -ne $env:SDK_ARCHIVE) {
            throw 'SDK archive disagrees with dependencies.lock.json'
          }
          New-Item -ItemType Directory -Force sdk-artifact | Out-Null
          gh release download $env:SDK_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $env:SDK_ARCHIVE `
            --dir sdk-artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "sdk-artifact\$env:SDK_ARCHIVE")) {
            throw "SDK asset is missing: $env:SDK_TAG/$env:SDK_ARCHIVE"
          }

      - name: Extract SDK
        env:
          SDK_ARCHIVE: ${{ steps.deps.outputs.msvc_sdk_archive }}
        run: |
          New-Item -ItemType Directory -Force sdk | Out-Null
          Expand-Archive "sdk-artifact\$env:SDK_ARCHIVE" sdk -Force
          if (-not (Test-Path sdk\SDK-MANIFEST.txt)) {
            throw 'SDK manifest missing'
          }
          if (-not (Test-Path sdk\lib\cmake\Qt6Keychain\Qt6KeychainConfig.cmake)) {
            throw 'Qt6Keychain package missing from SDK'
          }
          if (-not (Test-Path sdk\lib\cmake\Qca3-qt6\Qca3-qt6Config.cmake)) {
            throw 'Shared QCA package missing from SDK'
          }

      - name: Download verified released plugins and PsiMedia
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGINS_RELEASE_TAG: ${{ steps.deps.outputs.plugins_release_tag }}
          PLUGINS_SOURCE_SHA: ${{ steps.deps.outputs.plugins_ref }}
          PSIMEDIA_RELEASE_TAG: ${{ steps.deps.outputs.psimedia_release_tag }}
          PSIMEDIA_SOURCE_SHA: ${{ steps.deps.outputs.psimedia_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Confirm-PinnedTag {
            param([string]$Repository, [string]$Tag, [string]$Commit)
            if (-not $Tag -or -not $Commit -or $Commit -notmatch '^[0-9a-f]{40}$') {
              throw "Missing/invalid source lock for $Repository"
            }
            $ref = gh api "repos/$Repository/git/ref/tags/$Tag" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Cannot resolve $Repository tag $Tag" }
            $actual = $ref.object.sha
            if ($ref.object.type -eq 'tag') {
              $annotated = gh api "repos/$Repository/git/tags/$actual" | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw "Cannot peel $Repository tag $Tag" }
              $actual = $annotated.object.sha
            } elseif ($ref.object.type -ne 'commit') {
              throw "Unexpected tag type for $Repository/$Tag"
            }
            if ($actual -ne $Commit) {
              throw "Locked $Repository/$Tag references $actual rather than $Commit"
            }
          }
          Confirm-PinnedTag psi-im/plugins $env:PLUGINS_RELEASE_TAG $env:PLUGINS_SOURCE_SHA
          Confirm-PinnedTag psi-im/psimedia $env:PSIMEDIA_RELEASE_TAG $env:PSIMEDIA_SOURCE_SHA

          $pluginsAsset = "psi-plugins-$env:PLUGINS_RELEASE_TAG-qt612-windows-x64.zip"
          $mediaAsset = 'psimedia-windows-msvc-modern.zip'
          New-Item -ItemType Directory -Force released-plugins, released-media, release-downloads | Out-Null

          gh release download $env:PLUGINS_RELEASE_TAG --repo psi-im/plugins `
            --pattern $pluginsAsset --dir release-downloads
          if ($LASTEXITCODE -ne 0) { throw "Could not download $pluginsAsset" }
          gh release download $env:PSIMEDIA_RELEASE_TAG --repo psi-im/psimedia `
            --pattern $mediaAsset --dir release-downloads
          if ($LASTEXITCODE -ne 0) { throw "Could not download $mediaAsset" }
          if (-not (Test-Path "release-downloads/$pluginsAsset") -or
              -not (Test-Path "release-downloads/$mediaAsset")) {
            throw 'Required released extensions are missing'
          }
          Expand-Archive "release-downloads/$pluginsAsset" released-plugins -Force
          Expand-Archive "release-downloads/$mediaAsset" released-media -Force
          if (-not (Test-Path released-plugins/PLUGINS-MANIFEST.json)) {
            throw 'Published plugins 1.6 lack their integrity manifest'
          }
          if (-not (Test-Path released-media/stage-msvc-modern)) {
            throw 'Published PsiMedia artifact lacks the modern Windows stage'
          }

      - name: Build and package modern profile
        env:
          RUN_TESTS: ${{ startsWith(github.ref, 'refs/heads/ai/') }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          try {
            if ($env:RUN_TESTS -eq 'true') {
              & packaging\windows\build_profile_msvc.ps1 `
                -SdkDir "$pwd\sdk" `
                -OutputDir "$pwd\artifacts" `
                -RunTests 2>&1 |
                Tee-Object -FilePath artifacts\build-modern.log
            } else {
              & packaging\windows\build_profile_msvc.ps1 `
                -SdkDir "$pwd\sdk" `
                -OutputDir "$pwd\artifacts" 2>&1 |
                Tee-Object -FilePath artifacts\build-modern.log
            }
          } catch {
            $_ | Out-String | Tee-Object -FilePath artifacts\status-modern.txt
            throw
          }

      - name: Show compiler cache statistics
        run: |
          ccache --show-stats
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: psi-windows-modern-x64
          path: |
            artifacts/*.zip
            artifacts/*-setup.exe
            artifacts/dependencies-*.txt
            artifacts/version-*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psi-windows-modern-diagnostics
          path: |
            artifacts/*.log
            artifacts/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: windows-msvc-qt6-ccache-${{ github.sha }}
