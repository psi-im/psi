name: Temporary normalize Iris includes

on:
  push:
    branches:
      - ai/system-iris-linux

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/system-iris-linux

      - name: Normalize installed Iris includes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -RIl --include='*.h' --include='*.hpp' --include='*.cpp' --include='*.cc' --include='*.cxx' '<iris/jingle-rtp.h>' src tests qa 2>/dev/null || true)
          printf 'Replacing flat RTP facade in %d files\n' "${#files[@]}"
          test "${#files[@]}" -gt 0
          sed -i 's#<iris/jingle-rtp.h>#<iris/xmpp-im/jingle-rtp.h>#g' "${files[@]}"

          if grep -RIn --include='*.h' --include='*.hpp' --include='*.cpp' --include='*.cc' --include='*.cxx' '<iris/jingle-rtp.h>' src tests qa; then
            echo 'Flat jingle-rtp compatibility includes remain' >&2
            exit 1
          fi

          git diff --check
          git diff -- src tests qa
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests qa
          git commit -m 'Use installed Iris RTP headers [skip ci]'
          git push origin HEAD:ai/system-iris-linux
