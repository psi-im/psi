name: Ubuntu 24.04 Qt6 BASIC CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-qt6-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Ubuntu 24.04 / Qt6 / GCC / BASIC
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: psi-ubuntu2404-qt6-gcc-${{ github.sha }}
          restore-keys: |
            psi-ubuntu2404-qt6-gcc-
      - name: Install Qt6 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-multimedia-dev qt6-svg-dev libqt6sql6-sqlite \
            libhttp-parser-dev libhunspell-dev libminizip-dev libomemo-c-dev \
            libotr5-dev libprotobuf-c-dev libsm-dev libssl-dev \
            libsrtp2-dev libtidy-dev libusrsctp-dev libxss-dev zlib1g-dev
      - name: Initialize pinned sources
        run: |
          git submodule update --init --depth 1 \
            3rdparty/http-parser 3rdparty/qhttp 3rdparty/qite
          git submodule update --init --depth 1 iris
      - name: Install locked QCA3 Qt6
        uses: ./.github/actions/load-dependencies
        with:
          require-iris: 'true'
          qca-asset: qca3-deb-ubuntu-24.04.zip
          qca-install-mode: apt
      - name: Configure compiler cache
        run: |
          ccache --max-size=1G
          ccache --zero-stats
      - name: Build exact Iris gitlink for Qt6
        env:
          IRIS_INSTALL_PREFIX: ${{ runner.temp }}/iris-sdk
          IRIS_C_COMPILER: gcc
          IRIS_CXX_COMPILER: g++
          IRIS_QT_MAJOR: '6'
          IRIS_QCA_MAJOR: '3'
        run: bash .github/scripts/build-system-iris.sh
      - name: Configure and build Psi
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/iris-sdk" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DUSE_QT6=ON -DQT_DEFAULT_MAJOR_VERSION=6 \
            -DBUNDLED_IRIS=OFF -DCHAT_TYPE=BASIC \
            -DENABLE_PLUGINS=OFF -DBUILD_PSIMEDIA=OFF \
            -DUSE_KEYCHAIN=OFF -DUSE_HUNSPELL=ON \
            -DBUILD_TESTING=ON
          cmake --build build --parallel 4
      - name: Run native regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --no-tests=error -R '^avcall(policy|audiodirection)_test$'
      - name: Cache statistics
        run: ccache --show-stats
