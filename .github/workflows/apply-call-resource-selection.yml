name: Apply call resource selection patch

on:
  push:
    branches:
      - ai/jingle-native-calls

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Stage call resource selection patch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false
          ref: ai/jingle-native-calls
      - run: python3 .github/call-resource-selection-patch.py
      - run: |
          git rm .github/workflows/apply-call-resource-selection.yml .github/call-resource-selection-patch.py
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add src/psiaccount.cpp
          git commit -m 'Prefer call-capable XMPP resources for calls'
          git push origin HEAD:ai/jingle-native-calls
