name: Windows MSVC Qt 6.12 all-in-one packaging

# The only entry point that builds full Windows ZIP/NSIS packages.
# Both manual packaging and Psi releases reuse this exact workflow.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Psi version embedded in the all-in-one package
        required: true
        default: 1.6_b1
        type: string
  workflow_call:
    inputs:
      release_version:
        description: Psi version embedded in the all-in-one package
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: All-in-one Windows BASIC ZIP/NSIS and smoke test
    uses: ./.github/workflows/windows-msvc-qt6-profile.yml
    with:
      package: true
      release_version: ${{ inputs.release_version }}
    permissions:
      contents: read
