name: Apply P0 capability hardening

on:
  push:
    branches:
      - ai/jingle-native-calls

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    if: contains(github.event.head_commit.message, 'Run P0 capability hardening')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ai/jingle-native-calls
      - run: python3 .github/p0-capability-hardening.py
      - run: |
          git config user.name 'Sergei Ilinykh'
          git config user.email 'rion4ik@gmail.com'
          git add src/avcall/psimediajingle.h src/avcall/psimediajingle.cpp tests/avcall/backend-lifecycle/tst_backend_lifecycle.cpp
          git commit -m 'Harden native call capability snapshot'
          git push origin HEAD:ai/jingle-native-calls
