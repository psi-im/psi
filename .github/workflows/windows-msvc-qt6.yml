name: Windows MSVC Qt 6.12 packaging (BASIC default)

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'
  workflow_dispatch:
    inputs:
      chat_type:
        description: Chat rendering backend (default BASIC)
        type: choice
        options:
          - BASIC
          - WEBENGINE
        default: BASIC

permissions:
  contents: read

concurrency:
  group: windows-modern-msvc-qt6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-sdk:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !startsWith(github.ref_name, 'ai/')) ||
      (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'ai/'))
    name: Check modern dependency SDK
    runs-on: ubuntu-24.04
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      run_ci: ${{ steps.policy.outputs.run_ci }}
      sdk_tag: ${{ steps.deps.outputs.msvc_sdk_tag }}
      sdk_archive: ${{ steps.deps.outputs.msvc_sdk_archive }}

    steps:
      - name: Resolve ai branch CI policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PUSH_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          run_ci=true
          message=""

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            message="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq '.commit.message')"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            message="$PUSH_COMMIT_MESSAGE"
          fi

          if [[ "$EVENT_NAME" != "workflow_dispatch" && "$BRANCH_NAME" == "ci/psimedia-integration" ]]; then
            run_ci=false
          elif [[ "$EVENT_NAME" != "workflow_dispatch" && "$BRANCH_NAME" == ai/* && "$message" == *"[skip ci]"* ]]; then
            run_ci=false
          fi

          echo "run_ci=$run_ci" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.policy.outputs.run_ci == 'true'

      - name: Resolve locked Windows SDK
        id: deps
        if: steps.policy.outputs.run_ci == 'true'
        uses: ./.github/actions/load-dependencies

      - name: Check release asset
        if: steps.policy.outputs.run_ci == 'true'
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_TAG: ${{ steps.deps.outputs.msvc_sdk_tag }}
          SDK_ARCHIVE: ${{ steps.deps.outputs.msvc_sdk_archive }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$SDK_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' 2>/dev/null || true)"

          if grep -Fxq "$SDK_ARCHIVE" <<< "$assets"; then
            echo "SDK found: $SDK_TAG/$SDK_ARCHIVE"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "SDK missing: $SDK_TAG/$SDK_ARCHIVE"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-sdk:
    name: Build missing modern dependency SDK
    needs: check-sdk
    if: >-
      needs.check-sdk.outputs.run_ci == 'true' &&
      needs.check-sdk.outputs.exists != 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/windows-sdk-msvc-qt6.yml
    with:
      sdk_tag: ${{ needs.check-sdk.outputs.sdk_tag }}
      force_rebuild: false

  modern:
    name: Compile and test Windows 10/11 MSVC Qt 6.12 (${{ inputs.chat_type || 'BASIC' }})
    needs:
      - check-sdk
      - build-sdk
    if: >-
      always() &&
      needs.check-sdk.result == 'success' &&
      needs.check-sdk.outputs.run_ci == 'true' &&
      (needs.check-sdk.outputs.exists == 'true' || needs.build-sdk.result == 'success')
    permissions:
      contents: read
    uses: ./.github/workflows/windows-msvc-qt6-profile.yml
    with:
      package: false
      chat_type: ${{ inputs.chat_type || 'BASIC' }}
      sdk_tag: ${{ needs.check-sdk.outputs.sdk_tag }}
      sdk_archive: ${{ needs.check-sdk.outputs.sdk_archive }}
